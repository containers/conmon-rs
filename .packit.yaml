---
# See the documentation for more information:
# https://packit.dev/docs/configuration/

# Main branch commit build targets can be found at:
# https://copr.fedorainfracloud.org/coprs/rhcontainerbot/podman-next/

specfile_path: rpm/conmon-rs.spec
upstream_package_name: conmon-rs
downstream_package_name: conmon-rs
upstream_tag_template: v{version}

jobs:
  - job: copr_build
    trigger: pull_request
    enable_net: true
    targets:
      - fedora-all-x86_64
      - fedora-all-aarch64
      # TODO: Reenable once they have a stable Rust version for edition 2024
      # - epel-9-x86_64
      # - epel-9-aarch64
    additional_repos:
      - "copr://rhcontainerbot/podman-next"

  # Run on commit to main branch
  - job: copr_build
    trigger: commit
    branch: main
    owner: rhcontainerbot
    project: podman-next
    enable_net: true
