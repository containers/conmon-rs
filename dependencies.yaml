---
dependencies:
  - name: go
    version: 1.27.1
    refPaths:
      - path: go.mod
        match: ^go

  - name: golangci-lint
    version: 2.15.0
    refPaths:
      - path: .github/workflows/ci.yml
        match: "version: v"
      - path: Makefile
        match: "GOLANGCI_LINT_VERSION :="

  - name: prettier
    version: 3.9.10
    refPaths:
      - path: .github/workflows/ci.yml
        match: "prettier_version:"
      - path: Makefile
        match: "PRETTIER_VERSION :="

  - name: rust
    version: 1.99.1
    refPaths:
      - path: .github/workflows/ci.yml
        match: "RUST_VERSION:"
      - path: .github/workflows/gh-pages.yml
        match: "RUST_VERSION:"

  - name: shellcheck
    version: 0.11.0
    refPaths:
      - path: .github/workflows/ci.yml
        match: "SHELLCHECK_VERSION:"

  - name: zeitgeist
    version: 0.8.0
    refPaths:
      - path: Makefile
        match: "ZEITGEIST_VERSION :="

  - name: jaeger
    version: 2.22.0
    refPaths:
      - path: contrib/tracing/start
        match: JAEGER_IMG=

  - name: cri-tools
    version: 1.37.0
    refPaths:
      - path: .github/setup
        match: CRI_TOOLS_VERSION=

  - name: nix
    version: 2.35.3
    refPaths:
      - path: .github/workflows/ci.yml
        match: "NIX_VERSION:"
      - path: .github/workflows/build-static.yml
        match: "NIX_VERSION:"
      - path: .github/workflows/publish-static.yml
        match: "NIX_VERSION:"

  - name: cosign
    version: 3.1.4
    refPaths:
      - path: .github/workflows/ci.yml
        match: "cosign-release: v"
      - path: .github/workflows/publish-static.yml
        match: "cosign-release: v"
      - path: .github/workflows/build-sources.yml
        match: "cosign-release: v"
      - path: .github/workflows/release.yml
        match: "cosign-release: v"

  - name: alpine
    version: 3.24
    refPaths:
      - path: .github/workflows/build-static.yml
        match: "alpine:"

  - name: ubuntu-arm-runner
    version: 24.04
    refPaths:
      - path: .github/workflows/ci.yml
        match: "runs-on: ubuntu-.*-arm"
