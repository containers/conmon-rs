---
dependencies:
  - name: go
    version: 1.27.1
    refPaths:
      - path: go.mod
        match: ^go

  - name: golangci-lint
    version: 2.15.0
    refPaths:
      - path: .github/workflows/ci.yml
        match: "version: v"
      - path: Makefile
        match: "GOLANGCI_LINT_VERSION :="

  - name: zeitgeist
    version: 0.8.0
    refPaths:
      - path: Makefile
        match: "ZEITGEIST_VERSION :="

  - name: jaeger
    version: 2.22.0
    refPaths:
      - path: contrib/tracing/start
        match: JAEGER_IMG=

  - name: cri-tools
    version: 1.37.0
    refPaths:
      - path: .github/setup
        match: CRI_TOOLS_VERSION=

  - name: nix
    version: 2.35.3
    refPaths:
      - path: .github/workflows/ci.yml
        match: "NIX_VERSION:"
