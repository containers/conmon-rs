version: "2"
run:
  concurrency: 6
linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - iotamixing
    - ireturn
    - lll
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - nlreturn
    - noctx
    - nolintlint
    - nosprintfhostport
    - perfsprint
    - prealloc
    - predeclared
    - reassign
    - recvcheck
    - revive
    - spancheck
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
    # - depguard
    # - exhaustruct_v5
    # - funcorder
    # - gochecknoglobals
    # - noinlineerr
    # - nonamedreturns
    # - paralleltest
  settings:
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
    cyclop:
      max-complexity: 35
    errcheck:
      check-type-assertions: true
      check-blank: true
    funlen:
      lines: 155
      statements: 50
    gocognit:
      min-complexity: 50
    gocritic:
      enable-all: true
    gocyclo:
      min-complexity: 50
    godox:
      keywords:
        - BUG
        - FIXME
        - HACK
    gomoddirectives:
      # The integration suite tests the client of its own checkout.
      replace-local: true
    gosec:
      excludes:
        - G115
    govet:
      enable-all: true
      disable:
        - fieldalignment
    nestif:
      min-complexity: 15
    revive:
      enable-default-rules: true
      rules:
        - name: dot-imports
          disabled: true
    varnamelen:
      min-name-length: 1
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - goconst
      # The examples need a server, they only get compiled.
      - path: example_test\.go
        linters:
          - testableexamples
formatters:
  # gofumpt includes gofmt, gci sorts the imports.
  enable:
    - gci
    - gofumpt
    - golines
  exclusions:
    generated: lax
