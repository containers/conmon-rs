# The ci profile of the unit tests, see the test-unit job.
[profile.ci]
# A test which only passes on a retry is reported as flaky.
retries = 2
fail-fast = false
failure-output = "immediate-final"
# The slowest tests take a few seconds, about 10 under the qemu of the
# test-unit-ppc64le and test-unit-s390x jobs of the ci workflow, which use
# this profile for every pull request as well. A hanging one gets killed after
# a minute, so that it costs 3 minutes with its retries instead of holding up
# the job until its timeout.
slow-timeout = { period = "30s", terminate-after = 2 }

[profile.ci.junit]
path = "junit.xml"
