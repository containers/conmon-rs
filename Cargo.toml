[workspace]
resolver = "3"
members = ["conmon-rs/server", "fuzz"]
# The fuzz targets need cargo-fuzz and a nightly toolchain, see fuzz/.
default-members = ["conmon-rs/server"]

[workspace.package]
# Tracked in dependencies.yaml together with rpm/conmon-rs.spec.
version = "1.2.2"
edition = "2024"
# The oldest supported toolchain, which lint-msrv checks in CI. It may not be
# lower than the highest rust-version of the locked dependencies, see
# `cargo metadata`. rpm/conmon-rs.spec requires it of cargo, see make
# verify-spec.
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/containers/conmon-rs"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
ignored_unit_patterns = "warn"
manual_let_else = "warn"
needless_pass_by_ref_mut = "warn"
redundant_clone = "warn"
semicolon_if_nothing_returned = "warn"
undocumented_unsafe_blocks = "warn"
unused_async = "warn"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"
strip = true
