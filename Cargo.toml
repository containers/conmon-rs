[workspace]
resolver = "3"
members = ["conmon-rs/server"]

[workspace.package]
# Checked against rpm/conmon-rs.spec by `make verify-spec`.
version = "1.1.0"
edition = "2024"
# The oldest toolchain the locked dependencies support, checked by CI.
rust-version = "1.89"
license = "Apache-2.0"

[workspace.dependencies]
capnp = { version = "0.27.2", default-features = false }
capnpc = { version = "0.27.0", default-features = false }
tokio = { version = "1.54.0", default-features = false }

[profile.release]
debug = 0
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"
strip = true
