[package]
name = "conmonrs"
description = "A pod level OCI container runtime monitor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Shipped as a binary, see the releases.
publish = false

[[bin]]
name = "conmonrs"
path = "src/main.rs"

[dependencies]
anyhow = { version = "1.0.104", default-features = false }
async-channel = { version = "2.5.0", default-features = false, features = ["std"] }
bytes = { workspace = true }
capnp = { workspace = true }
capnp-rpc = { version = "0.27.1", default-features = false }
clap = { version = "4.6.7", default-features = false, features = ["derive", "env", "error-context", "help", "std", "usage"] }
data-encoding = { version = "2.11.1", default-features = false, features = ["alloc"] }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
futures = { version = "0.3.34", default-features = false, features = ["std"] }
getrandom = { version = "0.4.3", default-features = false }
hyper = { version = "1.12.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
libc = { version = "0.2.191", default-features = false }
memchr = { version = "2.8.3", default-features = false }
nix = { version = "0.31.3", default-features = false, features = ["event", "fs", "inotify", "mount", "poll", "process", "sched", "signal", "socket", "term", "user"] }
opentelemetry = { version = "0.33.1", default-features = false, optional = true }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["grpc-tonic", "trace"], optional = true }
opentelemetry-semantic-conventions = { version = "0.33.1", default-features = false, features = ["semconv_experimental"], optional = true }
percent-encoding = { version = "2.3.2", default-features = false, features = ["alloc"] }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-seqpacket = { version = "0.9.1", default-features = false }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
tokio-util = { version = "0.7.20", default-features = false, features = ["compat", "time"] }
tracing = { version = "0.1.44", default-features = false }
tracing-opentelemetry = { version = "0.34.0", default-features = false, optional = true }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"] }
time = { version = "0.3.55", default-features = false, features = ["formatting", "local-offset", "std"] }

[features]
default = []
tracing = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-semantic-conventions",
    "dep:tracing-opentelemetry",
    "nix/hostname",
]
# The entry points of the fuzz targets in fuzz/, which pause the clock of
# tokio.
fuzzing = ["tokio/test-util"]

[dev-dependencies]
tempfile = { version = "3.27.0", default-features = false }
time = { version = "0.3.55", default-features = false, features = ["parsing"] }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }

[build-dependencies]
capnp = { workspace = true }
capnpc = { workspace = true }
time = { version = "0.3.55", default-features = false, features = ["formatting", "macros"] }

[lints]
workspace = true
