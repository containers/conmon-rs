[package]
name = "conmonrs-cli"
version = "1.0.2"
edition = "2024"
license = "Apache-2.0"

[lints]
workspace = true

[dependencies]
capnp = { version = "0.27.2", default-features = false }
capnp-rpc = { version = "0.27.1", default-features = false }
conmon-common = { version = "1.0.2", path = "../common" }
futures = { version = "0.3.34", default-features = false }
tokio = { version = "1.54.0", default-features = false, features = ["fs", "macros", "net", "process", "rt", "signal", "time"] }
tokio-util = { version = "0.7.20", default-features = false, features = ["compat"] }
