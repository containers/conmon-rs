---
codecov:
  # Report once all CI jobs finished, with the unit and the integration
  # uploads in. wait_for_ci alone does not hold the status back until the
  # second upload is in. The integration job uploads also when its tests
  # failed, failing unit tests upload nothing, which leaves the PR without a
  # coverage status and comment.
  require_ci_to_pass: false
  notify:
    wait_for_ci: true
    after_n_builds: 2

coverage:
  precision: 2
  round: down
  range: 50..75
  status:
    patch:
      default:
        informational: true
    # Code paths which only some integration test runs hit, like timeouts,
    # make the coverage vary a bit between runs.
    project:
      default:
        threshold: 1%

# No flag carries forward: the integration coverage job uploads what got
# covered even when its tests failed, which shows as a drop of the coverage
# instead of an older result.

comment:
  after_n_builds: 2
  layout: "header, diff"
  behavior: default
  require_changes: false
