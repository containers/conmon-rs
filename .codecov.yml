---
codecov:
  # Report once all CI jobs finished, with the unit and the integration
  # uploads in, also when a job failed.
  require_ci_to_pass: false
  notify:
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: 50..75
  status:
    patch:
      default:
        informational: true
    # Code paths which only some integration test runs hit, like timeouts,
    # make the coverage vary a bit between runs.
    project:
      default:
        threshold: 1%

# The integration coverage job may fail without failing CI, its last result
# carries over to commits without an upload of their own.
flag_management:
  individual_flags:
    - name: integration
      carryforward: true

comment:
  layout: "header, diff"
  behavior: default
  require_changes: false
