---
codecov:
  notify:
    after_n_builds: 1
    require_ci_to_pass: false

coverage:
  precision: 2
  round: down
  range: 50..75
  status:
    patch:
      default:
        informational: true
    # Only the unit tests feed the report, code which the integration suite
    # covers counts as uncovered. Small drops from such code are expected.
    project:
      default:
        threshold: 1%

comment:
  layout: "header, diff"
  behavior: default
  require_changes: false
