[graph]
# Check the optional tracing dependencies as well.
all-features = true
# The architectures of flake.nix, other platforms only add duplicates which
# never get built.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "powerpc64le-unknown-linux-gnu",
    "s390x-unknown-linux-musl",
]
# The fuzz targets are not shipped, only built by CI.
exclude = ["conmonrs-fuzz"]
# Neither are the dependencies of the tests.
exclude-dev = true

[advisories]
unmaintained = "workspace"
yanked = "deny"

[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
# Duplicates grow the size optimized binary, new ones fail and the known ones
# are listed below.
multiple-versions = "deny"
skip = [
    { crate = "syn@2", reason = "only with the tracing feature, through proc macros of its dependencies" },
    { crate = "getrandom@0.3", reason = "only with the tracing feature, through opentelemetry_sdk" },
    { crate = "rand@0.9", reason = "only with the tracing feature, through opentelemetry_sdk" },
    { crate = "rand_core@0.9", reason = "only with the tracing feature, through opentelemetry_sdk" },
]
wildcards = "deny"

# The server runs on a current_thread runtime, the worker threads of the
# multi_thread one would only cost memory. The tests may use it.
[[bans.features]]
crate = "tokio"
deny = ["rt-multi-thread"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
