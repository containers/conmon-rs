[graph]
# Check the optional tracing dependencies as well.
all-features = true
# The architectures of flake.nix, other platforms only add duplicates which
# never get built.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "powerpc64le-unknown-linux-gnu",
    "s390x-unknown-linux-musl",
]
# The fuzz targets are not shipped, only built by CI.
exclude = ["conmonrs-fuzz"]

[advisories]
unmaintained = "workspace"
yanked = "warn"

[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
# Duplicates grow the size optimized binary, new ones fail and the known ones
# are listed below.
multiple-versions = "deny"
skip = [
    { crate = "getrandom@0.3", reason = "rand of tungstenite and opentelemetry_sdk, uuid uses 0.4" },
    { crate = "syn@2", reason = "proc macros only, not part of the binary" },
]
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
