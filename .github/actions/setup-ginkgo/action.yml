name: setup-ginkgo
description: >-
  Installs the ginkgo of the go.mod of the integration suite with make
  .install.ginkgo, which builds it, ginkgo has no release binaries. The cache
  holds the binary, only main saves it.
inputs:
  save:
    description: Whether to save the cache on a miss.
    default: "false"
runs:
  using: composite
  steps:
    # The binary depends on the Go which built it.
    - name: Go version
      id: go
      shell: bash
      run: echo "version=$(go env GOVERSION)" >>"$GITHUB_OUTPUT"
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: ginkgo
      with:
        path: .build/gotools/bin/ginkgo
        key: ginkgo-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.version }}-${{ hashFiles('pkg/client/integration/go.mod') }}
    - name: Install ginkgo
      shell: bash
      run: make .install.ginkgo
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.save == 'true' && steps.ginkgo.outputs.cache-hit != 'true'
      with:
        path: .build/gotools/bin/ginkgo
        key: ${{ steps.ginkgo.outputs.cache-primary-key }}
