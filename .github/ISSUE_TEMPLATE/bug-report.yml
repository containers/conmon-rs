name: Bug Report
description: Report a bug encountered while operating conmon-rs
labels: kind/bug
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: |
        Please provide as much info as possible. Not doing so may result in your bug not being addressed in a timely manner.
        If this matter is security related, please disclose it privately as described in the [security policy](https://github.com/containers/conmon-rs/blob/main/SECURITY.md).
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How can we reproduce it (as minimally and precisely as possible)?
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Anything else we need to know?

  - type: textarea
    id: conmonrsVersion
    attributes:
      label: conmon-rs version
      value: |
        <details>

        ```console
        $ conmonrs --version
        # paste output here
        ```

        </details>
    validations:
      required: true

  - type: textarea
    id: crioVersion
    attributes:
      label: Container engine and OCI runtime
      description: The CRI-O version or the one of another engine, and the OCI runtime with its version.
      value: |
        <details>

        ```console
        $ crio version
        # paste output here
        $ crun --version  # or runc --version
        # paste output here
        ```

        </details>
    validations:
      required: true

  - type: textarea
    id: osVersion
    attributes:
      label: OS version
      value: |
        <details>

        ```console
        # On Linux:
        $ cat /etc/os-release
        # paste output here
        $ uname -a
        # paste output here
        $ stat -fc %T /sys/fs/cgroup  # cgroup2fs means cgroup v2
        # paste output here
        ```

        </details>
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Server logs
      description: |
        The logs of the conmonrs process of the pod, ideally with `--log-level debug`, which CRI-O passes to the servers of pods it starts while it runs with `log_level = "debug"`. Since v1.34, CRI-O only lets them log to the journal with `LOG_DRIVER=systemd` in the `monitor_env` of the runtime handler. See the troubleshooting section of usage.md for how to find them. Since v1.2.1 `journalctl -t conmonrs` shows the server logs. In v1.2.1 it also shows the output of `journald` containers without a tag. Older servers only log under `_COMM=conmonrs`, which also has the output of all containers which use that driver. Redact container output and anything else sensitive before you paste the logs, the issue is public.
      value: |
        <details>

        ```console
        $ journalctl -t conmonrs
        # servers before v1.2.1: journalctl _COMM=conmonrs
        # paste output here, with container output redacted
        ```

        </details>

  - type: textarea
    id: environment
    attributes:
      label: Additional environment details (AWS, VirtualBox, physical, etc.)
      value: |
        <details>

        </details>
    validations:
      required: true
