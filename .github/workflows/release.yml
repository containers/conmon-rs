name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

# A rerun of a tag waits for the previous one, both change its release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # The binaries come from the bucket, which forks have no access to.
  build-sources:
    if: github.repository == 'containers/conmon-rs'
    permissions:
      actions: read # looks up the ci runs of the commit
      attestations: write # attests the sources and checksums
      contents: read
      id-token: write # signs the sources and checksums
    uses: ./.github/workflows/build-sources.yml

  # Verifies all files once more, then publishes them.
  release:
    needs: build-sources
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      attestations: read # verifies the attestations
      contents: write # creates the release
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    outputs:
      minor: ${{ steps.minor.outputs.minor }}
    steps:
      # The marker of the release, build-sources rejects tags other than
      # vX.Y.Z.
      - name: Minor version
        id: minor
        run: echo "minor=${TAG%.*}" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Verify
        working-directory: release
        run: |
          ../.github/release-files binaries
          ../.github/release-files sources
      # Creates a draft with generated notes, uploads the files to it and only
      # then publishes it, an immutable release gets no more files. The notes
      # of a patch release start at the previous patch of its minor. A rerun
      # continues with the draft, which gh finds by its tag as well, and
      # leaves a published release alone if it has all files. A release only
      # becomes the latest one if no other release has a higher version,
      # unlike a patch release of an older minor. build-sources rejects tags
      # other than vX.Y.Z. A failing command only fails the step outside of a
      # pipe or a process substitution.
      - name: Release
        working-directory: release
        run: |
          LIST=$(../.github/release-files files)
          mapfile -t FILES <<<"$LIST"
          if ! DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>"$RUNNER_TEMP/view"); then
            if ! grep -q "release not found" "$RUNNER_TEMP/view"; then
              echo "::error::Unable to look up release $TAG: $(<"$RUNNER_TEMP/view")"
              exit 1
            fi
            MINOR=${TAG%.*}
            REFS=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$MINOR." --paginate --jq '.[].ref')
            PREVIOUS=
            for T in $(printf '%s\n' "$REFS" "refs/tags/$TAG" | grep -E "^refs/tags/${MINOR//./\\.}\.[0-9]+$" | sort -uV); do
              if [[ $T == "refs/tags/$TAG" ]]; then
                break
              fi
              PREVIOUS=${T#refs/tags/}
            done
            NOTES=(--generate-notes)
            if [[ -n $PREVIOUS ]]; then
              NOTES+=(--notes-start-tag "$PREVIOUS")
            fi
            gh release create "$TAG" --draft --verify-tag --title "$TAG" "${NOTES[@]}"
            DRAFT=true
          fi
          if [[ $DRAFT != true ]]; then
            ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name')
            MISSING=$(comm -23 <(printf '%s\n' "${FILES[@]}" | sort) <(sort <<<"$ASSETS"))
            if [[ -n $MISSING ]]; then
              echo "::error::Release $TAG got published without all of its files, missing: ${MISSING//$'\n'/ }. Delete it and rerun the workflow, or tag a new version if it is immutable."
              exit 1
            fi
            echo "::notice::Release $TAG is published with all files already, leaving it as it is."
            exit 0
          fi
          gh release upload "$TAG" --clobber "${FILES[@]}"
          RELEASES=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1000 --json tagName --jq '.[].tagName')
          HIGHEST=$(printf '%s\n' "$RELEASES" "$TAG" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          LATEST=false
          if [[ $HIGHEST == "$TAG" ]]; then
            LATEST=true
          fi
          gh release edit "$TAG" --draft=false --latest="$LATEST"

  # Points the latest-X.Y.txt marker in the bucket to this tag, once the
  # release has its binaries. The marker only moves forward, see
  # .github/create-marker, a rerun of an older patch release does not move it
  # back. The jobs of a minor version run one at a time, the workflow only
  # waits for the runs of the same tag, and two patch releases could both
  # read the old marker and the older one upload last otherwise. A third job
  # replaces a waiting one, which leaves the marker behind until a rerun, but
  # never moves it back.
  publish-marker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == 'containers/conmon-rs'
    needs: release
    concurrency:
      group: ${{ github.workflow }}-publish-marker-${{ needs.release.outputs.minor }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/publish-marker
        with:
          credentials: ${{ secrets.GCS_CRIO_SA }}
