name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

# A rerun of a tag waits for the previous one, both change its release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # The binaries come from the bucket, which forks have no access to.
  build-sources:
    if: github.repository == 'containers/conmon-rs'
    permissions:
      actions: read # looks up the ci runs of the commit
      attestations: write # attests the sources and checksums
      contents: read
      id-token: write # signs the sources and checksums
    uses: ./.github/workflows/build-sources.yml

  # Verifies all files once more, then publishes them.
  release:
    needs: build-sources
    runs-on: ubuntu-latest
    permissions:
      attestations: read # verifies the attestations
      contents: write # creates the release
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Verify
        working-directory: release
        run: |
          ../.github/release-files binaries
          ../.github/release-files sources
      # Updates the assets of an existing release, like on a rerun.
      - name: Release
        working-directory: release
        run: |
          mapfile -t FILES < <(../.github/release-files files)
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes ""
          fi
          gh release upload "$TAG" --clobber "${FILES[@]}"

  # Points the latest-X.Y.txt marker in the bucket to this tag, once the
  # release has its binaries.
  publish-marker:
    runs-on: ubuntu-latest
    if: github.repository == 'containers/conmon-rs'
    needs: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: .github/create-marker
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCS_CRIO_SA }}
      # The marker changes in place, caches must not serve an old one.
      - uses: google-github-actions/upload-cloud-storage@6397bd7208e18d13ba2619ee21b9873edc94427a # v3.0.0
        with:
          path: .
          glob: latest-*.txt
          destination: cri-o/conmon-rs
          headers: |-
            cache-control: no-cache
