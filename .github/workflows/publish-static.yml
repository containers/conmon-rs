name: publish-static
# Attests the SLSA provenance, the SBOM and the VEX document of the static
# binary, which the build-static workflow built and scanned earlier in the same
# run, signs it and uploads it to the bucket.
#
# The build runs in a job without access to the OIDC token, this workflow runs
# no build steps, not even a checkout, and is the only one which can sign.
# Consumers verify it as the signer workflow, see the README, which makes the
# provenance SLSA Build L3 like the generic generator of slsa-github-generator.
on:
  workflow_call:
    inputs:
      arch:
        description: The architecture to publish, a package of the flake.
        required: true
        type: string
      digest:
        description: The sha256 of the binary, an output of build-static.
        required: true
        type: string
      sbom-digest:
        description: The sha256 of the SBOM of the binary, an output of build-static.
        required: true
        type: string
      vex-digest:
        description: The sha256 of the VEX document of the binary, an output of build-static.
        required: true
        type: string
      artifact-id:
        description: The artifact which holds the binary, its SBOM and its VEX document, an output of build-static.
        required: true
        type: string
    secrets:
      GCS_CRIO_SA:
        description: Uploads the binaries to the bucket.
        required: true
permissions: {}
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # signs with cosign and the attestations
      attestations: write # stores the attestations
    env:
      ARCH: ${{ inputs.arch }}
      DIGEST: ${{ inputs.digest }}
      SBOM_DIGEST: ${{ inputs.sbom-digest }}
      VEX_DIGEST: ${{ inputs.vex-digest }}
    steps:
      # Exactly the artifact, the binary, the SBOM and the VEX document the
      # build job produced, other jobs of the run could upload another one of
      # the same name.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.artifact-id }}
          merge-multiple: true
          path: build
      - name: Prepare the upload
        run: |
          printf '%s  %s\n' "$DIGEST" build/conmonrs "$SBOM_DIGEST" build/conmonrs.spdx.json \
            "$VEX_DIGEST" build/conmonrs.vex.json | sha256sum -c --strict
          mkdir "$GITHUB_SHA"
          cp build/conmonrs "$GITHUB_SHA/conmonrs.$ARCH"
          cp build/conmonrs.spdx.json "$GITHUB_SHA/conmonrs.$ARCH.spdx.json"
          cp build/conmonrs.vex.json "$GITHUB_SHA/conmonrs.$ARCH.vex.json"
          cd "$GITHUB_SHA"
          sha256sum "conmonrs.$ARCH" >"conmonrs.$ARCH.sha256"
      # A rerun on main, like of a released commit, must not replace the
      # binary of the commit with other bits, nor its signature and
      # attestations with ones of other bits. The binary stays if it is the
      # same and all of its files got uploaded, without new attestations or
      # signatures, the files of the same binary get uploaded again otherwise.
      - name: Check the bucket
        id: bucket
        run: |
          URL=https://storage.googleapis.com/cri-o/conmon-rs/$GITHUB_SHA
          STATUS=$(curl -sSL --retry 5 -o "$RUNNER_TEMP/existing" -w '%{http_code}' "$URL/conmonrs.$ARCH")
          if [[ $STATUS == 404 ]]; then
            echo "upload=true" >>"$GITHUB_OUTPUT"
            exit 0
          elif [[ $STATUS != 200 ]]; then
            echo "::error::Unable to check the bucket for conmonrs.$ARCH of $GITHUB_SHA: HTTP $STATUS"
            exit 1
          fi
          if ! echo "$DIGEST  $RUNNER_TEMP/existing" | sha256sum -c --quiet; then
            echo "::error::The bucket has another conmonrs.$ARCH for $GITHUB_SHA, refusing to replace it."
            exit 1
          fi
          for FILE in conmonrs.$ARCH{.sha256,.bundle,.intoto.jsonl,.spdx.json,.spdx.intoto.jsonl,.vex.json,.vex.intoto.jsonl}; do
            if ! curl -sfIL --retry 5 -o /dev/null "$URL/$FILE"; then
              echo "The bucket misses $FILE of the same binary, uploading all files again"
              echo "upload=true" >>"$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::notice::The bucket already has the same conmonrs.$ARCH for $GITHUB_SHA, skipping the upload."
          echo "upload=false" >>"$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: provenance
        if: steps.bucket.outputs.upload == 'true'
        with:
          subject-path: ${{ github.sha }}/conmonrs.${{ inputs.arch }}
      # The SPDX document gets the predicate type https://spdx.dev/Document/v2.3.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: sbom
        if: steps.bucket.outputs.upload == 'true'
        with:
          subject-path: ${{ github.sha }}/conmonrs.${{ inputs.arch }}
          sbom-path: ${{ github.sha }}/conmonrs.${{ inputs.arch }}.spdx.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: vex
        if: steps.bucket.outputs.upload == 'true'
        with:
          subject-path: ${{ github.sha }}/conmonrs.${{ inputs.arch }}
          predicate-type: https://openvex.dev/ns/v0.2.0
          predicate-path: ${{ github.sha }}/conmonrs.${{ inputs.arch }}.vex.json
      # The bundles allow verifying without the attestations API.
      - name: Keep the attestation bundles
        if: steps.bucket.outputs.upload == 'true'
        env:
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM: ${{ steps.sbom.outputs.bundle-path }}
          VEX: ${{ steps.vex.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE" "$GITHUB_SHA/conmonrs.$ARCH.intoto.jsonl"
          cp "$SBOM" "$GITHUB_SHA/conmonrs.$ARCH.spdx.intoto.jsonl"
          cp "$VEX" "$GITHUB_SHA/conmonrs.$ARCH.vex.intoto.jsonl"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.bucket.outputs.upload == 'true'
        with:
          cosign-release: v3.1.4
      - name: Sign binary
        if: steps.bucket.outputs.upload == 'true'
        run: |
          cd "$GITHUB_SHA"
          cosign sign-blob -y "conmonrs.$ARCH" --bundle "conmonrs.$ARCH.bundle"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: steps.bucket.outputs.upload == 'true'
        with:
          credentials_json: ${{ secrets.GCS_CRIO_SA }}
      - uses: google-github-actions/upload-cloud-storage@6397bd7208e18d13ba2619ee21b9873edc94427a # v3.0.0
        if: steps.bucket.outputs.upload == 'true'
        with:
          path: ${{ github.sha }}
          destination: cri-o/conmon-rs
          process_gcloudignore: false
