name: publish-static
# Attests the SLSA provenance and the SBOM of the static binary, which the
# build-static workflow built earlier in the same run, signs it and uploads it
# to the bucket.
#
# The build runs in a job without access to the OIDC token, this workflow runs
# no build steps and is the only one which can sign. Consumers verify it as the
# signer workflow, see the README, which makes the provenance SLSA Build L3 like
# the generic generator of slsa-github-generator.
on:
  workflow_call:
    inputs:
      arch:
        description: The architecture to publish, a package of the flake.
        required: true
        type: string
      digest:
        description: The sha256 of the binary, an output of build-static.
        required: true
        type: string
      artifact-id:
        description: The artifact which holds the binary, an output of build-static.
        required: true
        type: string
    secrets:
      GCS_CRIO_SA:
        description: Uploads the binaries to the bucket.
        required: true
permissions: {}
env:
  NIX_VERSION: "2.35.3"
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # signs with cosign and the attestations
      attestations: write # stores the attestations
    env:
      ARCH: ${{ inputs.arch }}
      DIGEST: ${{ inputs.digest }}
    steps:
      # Only for flake.lock, which pins syft.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          install_url: https://releases.nixos.org/nix/nix-${{ env.NIX_VERSION }}/install
      # Exactly the artifact and the binary the build job produced, other jobs
      # of the run could upload another one of the same name.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.artifact-id }}
          merge-multiple: true
          path: build
      - name: Prepare the upload
        run: |
          echo "$DIGEST  build/conmonrs" | sha256sum -c
          mkdir "$GITHUB_SHA"
          cp build/conmonrs "$GITHUB_SHA/conmonrs.$ARCH"
          cd "$GITHUB_SHA"
          sha256sum "conmonrs.$ARCH" >"conmonrs.$ARCH.sha256"
      # The build embeds its dependencies with cargo-auditable, which syft
      # reads. syft writes SPDX 2.3, SPDX 3 needs a generator which reads them
      # and attest-sbom support.
      - name: SBOM
        run: |
          nix shell --inputs-from . nixpkgs#syft --command \
            syft scan "file:$GITHUB_SHA/conmonrs.$ARCH" -q -o "spdx-json=$GITHUB_SHA/conmonrs.$ARCH.spdx.json"
          jq -e '.packages | length > 10' "$GITHUB_SHA/conmonrs.$ARCH.spdx.json"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: provenance
        with:
          subject-path: ${{ github.sha }}/conmonrs.${{ inputs.arch }}
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        id: sbom
        with:
          subject-path: ${{ github.sha }}/conmonrs.${{ inputs.arch }}
          sbom-path: ${{ github.sha }}/conmonrs.${{ inputs.arch }}.spdx.json
      # The bundles allow verifying without the attestations API.
      - name: Keep the attestation bundles
        env:
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE" "$GITHUB_SHA/conmonrs.$ARCH.intoto.jsonl"
          cp "$SBOM" "$GITHUB_SHA/conmonrs.$ARCH.spdx.intoto.jsonl"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Sign binary
        run: |
          cd "$GITHUB_SHA"
          cosign sign-blob -y "conmonrs.$ARCH" --bundle "conmonrs.$ARCH.bundle"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCS_CRIO_SA }}
      - uses: google-github-actions/upload-cloud-storage@6397bd7208e18d13ba2619ee21b9873edc94427a # v3.0.0
        with:
          path: ${{ github.sha }}
          destination: cri-o/conmon-rs
