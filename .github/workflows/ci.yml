name: ci
on:
  pull_request: {}
  push:
    branches:
      - main
# Pull requests cancel their outdated runs. Every main commit gets a run of its
# own: the release workflow needs the binaries of the tagged commit, and a run
# waiting in a shared group would be replaced by the one of a newer commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  # The file and line numbers of the backtraces of the tests, without the
  # rest of the debug info, which would take most of the space of the build
  # caches.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # The toolchain of the Rust jobs. A new stable release brings new lints,
  # which a bump of this version picks up instead of unrelated pull requests.
  RUST_VERSION: "1.99.1"
  # The checksum belongs to the x86_64 Linux release of this version.
  SHELLCHECK_VERSION: "0.11.0"
  SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
  # The checksum belongs to the static x86_64 Linux (musl) release of this
  # version, see make lint-links.
  LYCHEE_VERSION: "0.24.2"
  LYCHEE_SHA256: "73657a111819a30c47c08352896796f23d64e4eb2b3ed39b6d32149241566fc5"
  # cargo-fuzz needs a nightly toolchain, a pinned one keeps new lints and
  # compiler changes out of unrelated pull requests.
  FUZZ_TOOLCHAIN: "nightly-2026-10-15"
  # Only main saves the build caches, which pull requests restore. One per
  # pull request would push the caches of main out of the 10 GB of the
  # repository.
  SAVE_CACHE: ${{ github.ref == 'refs/heads/main' }}
# The jobs are named by what they do: lint-* checks the sources,
# verify-* checks that generated or pinned things are up to date, build-* and
# test-* build and test the server, publish-* changes the bucket or the cache.
# changes decides which of them a pull request needs.
jobs:
  # Lists the files a pull request changes, see .github/changes, for the jobs
  # which only run if their files changed: fuzz tells whether the fuzz
  # targets may have changed, which build-fuzz and test-fuzz check with about
  # half of the runner minutes of a pull request, code whether anything
  # besides the documentation changed, which all jobs besides lint-files
  # check. The jobs which need a skipped one skip as well, like
  # verify-vulnerabilities, the test-integration and the test-critest jobs.
  # The checkout of a pull request is the merge commit which GitHub tests,
  # with its first parent, the branch it merges into, so git lists the files
  # without the limit on their number of the API. The steps may fail without
  # failing the job, whose outputs are only false if the script said so:
  # anything it cannot tell runs the jobs.
  # Every job of main runs: a release takes a commit of main only if all of
  # its other jobs passed or got skipped by their own conditions, see
  # .github/release-files, and the advisories workflow fuzzes the targets of
  # the latest passed run of main. Pull requests skip the publish jobs anyway,
  # GitHub counts skipped jobs as passed checks, and main has no required
  # checks, tide merges the pull requests. A skipped matrix job shows its name
  # with the expression unexpanded, see publish-cache.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      fuzz: ${{ github.event_name != 'pull_request' || steps.changes.outputs.fuzz != 'false' }}
      code: ${{ github.event_name != 'pull_request' || steps.changes.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        continue-on-error: true
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: List the changes
        id: changes
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: .github/changes >>"$GITHUB_OUTPUT"

  verify-proto:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only builds capnpc-go, which is not worth a cache entry of its own.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/setup-nix
      - run: make verify-proto
      # Older clients and servers have to keep working with this one, which
      # needs every field to keep its slot, see .github/verify-schema-layout.
      - run: make verify-schema-layout

  lint-go:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The history with the tags, for the latest release which make
      # verify-go-api compares with.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        id: go
      # The module is what CRI-O vendors, its go.sum has to be complete and
      # match the module proxy. The integration suite is a module of its own.
      - name: Verify the Go modules
        run: |
          for DIR in . pkg/client/integration; do
            go -C "$DIR" mod tidy -diff
            go -C "$DIR" mod verify
          done
      # CRI-O builds the client for FreeBSD as well.
      - name: Build the Go client for other platforms
        run: |
          for GOOS in freebsd darwin; do
            CGO_ENABLED=0 GOOS=$GOOS go build ./pkg/client/
          done
      # CRI-O vendors the client, which has to stay compatible within a major
      # version, see release.md.
      - name: Verify the API of the Go client
        run: make verify-go-api
      # The sources are lint clean, so all issues fail, not only new ones.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          skip-save-cache: ${{ env.SAVE_CACHE != 'true' }}
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: pkg/client/integration
          skip-save-cache: ${{ env.SAVE_CACHE != 'true' }}
      - uses: ./.github/actions/save-go
        if: env.SAVE_CACHE == 'true' && steps.go.outputs.cache-hit != 'true'
        with:
          key: ${{ steps.go.outputs.key }}
          paths: ${{ steps.go.outputs.paths }}

  # One build environment for all checks of the Rust sources. Every check runs
  # even if an earlier one fails, so that a run reports all of them.
  lint-rust:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # With the oldest toolchain the locked dependencies support, which make
      # lint-msrv uses.
      - uses: ./.github/actions/setup-rust
        id: setup
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy,rustfmt
          msrv: true
          save-if: ${{ env.SAVE_CACHE }}
      # The checks are the ones of make lint-rust and make lint-msrv, see the
      # Makefile, and only run on a complete setup, which they would report as
      # their own failures otherwise.
      - name: Rustfmt
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: make lint-rustfmt
      - name: Clippy Lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: make lint-clippy
      - name: Cargo doc
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: make lint-rustdoc
      - name: Cargo check with rust-version
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: make lint-msrv

  # The checks which take seconds each, in one job instead of a runner each:
  # the shell scripts, the workflows, the spelling, the formatting of prettier,
  # the links of the Markdown files, the pinned versions of dependencies.yaml
  # and the RPM spec, the unreleased markers and the VEX document. Like in
  # lint-rust, every check runs even if an earlier one fails, and only on a
  # complete setup. Pull requests which change nothing but the documentation
  # skip all other jobs besides changes.
  lint-files:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false
      - name: Install shellcheck
        id: shellcheck
        run: |
          curl -sSfL -o shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          sudo tar -xJf shellcheck.tar.xz --strip-components=1 -C /usr/local/bin "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          rm shellcheck.tar.xz
          shellcheck --version
      - name: Shellcheck
        if: ${{ !cancelled() && steps.shellcheck.outcome == 'success' }}
        run: make lint-shell
      # actionlint and zizmor, see the Makefile. The online audits of zizmor
      # read the GitHub API.
      - name: Lint workflows
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: make lint-workflows
        env:
          CONTAINER_RUNTIME: docker
          GH_TOKEN: ${{ github.token }}
          ZIZMOR_FLAGS: --format=github
      - name: Typos
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
        with:
          config: .github/typos.toml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        id: node
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        with:
          node-version: 26.13.0
      # prettier has no dependencies, npm checks it against the integrity of
      # the registry.
      - name: Prettier
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: npx --yes "prettier@$PRETTIER_VERSION" --check .
        env:
          PRETTIER_VERSION: 3.9.10
      # The static binary, which the tarball has in a directory of its name.
      - name: Install lychee
        id: lychee
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          NAME=lychee-x86_64-unknown-linux-musl
          curl -sSfL -o lychee.tar.gz \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/$NAME.tar.gz"
          echo "${LYCHEE_SHA256}  lychee.tar.gz" | sha256sum -c -
          sudo tar -xzf lychee.tar.gz --strip-components=1 -C /usr/local/bin "$NAME/lychee"
          rm lychee.tar.gz
          lychee --version
      - name: Check the Markdown links
        if: ${{ !cancelled() && steps.lychee.outcome == 'success' }}
        run: make lint-links
      # zeitgeist is a release binary, see the Makefile.
      - name: Verify dependencies
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: make verify-dependencies
      - name: Verify the RPM spec
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: make verify-spec
      # From the version bump PR until its tag exists, nothing may say
      # "unreleased" any more, see release.md.
      - name: Verify the unreleased markers
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: make verify-unreleased
      - name: Verify the VEX document
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: make verify-vex

  verify-deny:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  # Scans the SBOMs of the static binaries with grype and the VEX document, see
  # make scan, which covers the GitHub advisories of the crates which got built
  # in, like verify-deny does for the RustSec ones of Cargo.lock. Not every
  # architecture builds in the same crates, so every SBOM gets scanned. The
  # advisories workflow scans the latest binaries of main every day. The
  # publish jobs do not wait for the scan: CRI-O CI installs the latest
  # binaries of main, which a new advisory must not hold back, and a failure
  # shows on main.
  verify-vulnerabilities:
    needs:
      - build-static-amd64
      - build-static-arm64
      - build-static-ppc64le
      - build-static-s390x
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-static-*
          path: .build/static
      # The newest vulnerability database of main, which grype updates if a
      # newer one got built. The key names the build of the database, see
      # .github/scan-sboms, main saves one which grype updated, like the
      # advisories workflow does, so that the runs after it start with it.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: grype-db
        with:
          path: .build/grype-db
          key: grype-db-
          restore-keys: grype-db-
      - name: Scan
        id: scan
        env:
          CONTAINER_RUNTIME: docker
        run: |
          SBOMS=(.build/static/build-static-*/conmonrs.spdx.json)
          make scan SBOMS="${SBOMS[*]}"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() && env.SAVE_CACHE == 'true' && steps.scan.outputs.db-key && steps.scan.outputs.db-key != steps.grype-db.outputs.cache-matched-key }}
        with:
          path: .build/grype-db
          key: ${{ steps.scan.outputs.db-key }}

  # The Go dependencies follow CRI-O, which vendors the client, so a finding
  # only shows up as a warning and in the summary, without failing the pull
  # request. Other errors of govulncheck fail. The advisories workflow fails
  # for a finding every day. The standard library is the one of the Go
  # toolchain which builds CRI-O, so the latest Go release checks it instead of
  # the minimum version of go.mod.
  verify-go-vulnerabilities:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The latest Go release changes the key of a cache, which would keep
      # adding entries.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      # Without a cache, the module proxy fails the job now and then, like
      # with an INTERNAL_ERROR, so the downloads get retried before the scan.
      # go run would turn the exit code of govulncheck into 1.
      - name: Download govulncheck and the Go modules
        run: |
          for ATTEMPT in 1 2 3; do
            if GOBIN=$RUNNER_TEMP go install golang.org/x/vuln/cmd/govulncheck@v1.9.0 &&
              go mod download; then
              exit 0
            fi
            if ((ATTEMPT < 3)); then
              echo "::warning::Downloading the Go modules failed, retrying"
              sleep $((ATTEMPT * 15))
            fi
          done
          exit 1
      - name: govulncheck
        run: |
          STATUS=0
          "$RUNNER_TEMP/govulncheck" ./... >govulncheck.txt 2>&1 || STATUS=$?
          cat govulncheck.txt
          # 3 means vulnerabilities found.
          if ((STATUS == 3)); then
            echo "::warning::govulncheck reported vulnerabilities, see the summary"
            printf '### govulncheck\n\n~~~\n%s\n~~~\n' "$(cat govulncheck.txt)" >>"$GITHUB_STEP_SUMMARY"
          elif ((STATUS != 0)); then
            exit "$STATUS"
          fi

  # The architectures are the packages of flake.nix, .github/release-files and
  # scripts/get list them as well. Every architecture gets its own build and
  # publish job: the tests only wait for their build, and each publish only
  # for its own build. The builds have no access to the signing credentials,
  # see publish-static.yml, and only read the cache, see publish-cache.
  build-static-amd64:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/build-static.yml
    with:
      arch: amd64

  build-static-arm64:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/build-static.yml
    with:
      arch: arm64

  build-static-ppc64le:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/build-static.yml
    with:
      arch: ppc64le

  build-static-s390x:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/build-static.yml
    with:
      arch: s390x

  # Attests, signs and uploads the binaries of main. The tests do not wait for
  # it, an outage of the signing services only holds up the marker.
  publish-static-amd64:
    if: github.repository == 'containers/conmon-rs' && github.ref == 'refs/heads/main'
    needs: build-static-amd64
    permissions:
      contents: read
      id-token: write # signs the binary, see publish-static.yml
      attestations: write # attests its provenance, SBOM and VEX document
    uses: ./.github/workflows/publish-static.yml
    with:
      arch: amd64
      digest: ${{ needs.build-static-amd64.outputs.digest }}
      sbom-digest: ${{ needs.build-static-amd64.outputs.sbom-digest }}
      vex-digest: ${{ needs.build-static-amd64.outputs.vex-digest }}
      artifact-id: ${{ needs.build-static-amd64.outputs.artifact-id }}
    secrets:
      GCS_CRIO_SA: ${{ secrets.GCS_CRIO_SA }}

  publish-static-arm64:
    if: github.repository == 'containers/conmon-rs' && github.ref == 'refs/heads/main'
    needs: build-static-arm64
    permissions:
      contents: read
      id-token: write # signs the binary, see publish-static.yml
      attestations: write # attests its provenance, SBOM and VEX document
    uses: ./.github/workflows/publish-static.yml
    with:
      arch: arm64
      digest: ${{ needs.build-static-arm64.outputs.digest }}
      sbom-digest: ${{ needs.build-static-arm64.outputs.sbom-digest }}
      vex-digest: ${{ needs.build-static-arm64.outputs.vex-digest }}
      artifact-id: ${{ needs.build-static-arm64.outputs.artifact-id }}
    secrets:
      GCS_CRIO_SA: ${{ secrets.GCS_CRIO_SA }}

  publish-static-ppc64le:
    if: github.repository == 'containers/conmon-rs' && github.ref == 'refs/heads/main'
    needs: build-static-ppc64le
    permissions:
      contents: read
      id-token: write # signs the binary, see publish-static.yml
      attestations: write # attests its provenance, SBOM and VEX document
    uses: ./.github/workflows/publish-static.yml
    with:
      arch: ppc64le
      digest: ${{ needs.build-static-ppc64le.outputs.digest }}
      sbom-digest: ${{ needs.build-static-ppc64le.outputs.sbom-digest }}
      vex-digest: ${{ needs.build-static-ppc64le.outputs.vex-digest }}
      artifact-id: ${{ needs.build-static-ppc64le.outputs.artifact-id }}
    secrets:
      GCS_CRIO_SA: ${{ secrets.GCS_CRIO_SA }}

  publish-static-s390x:
    if: github.repository == 'containers/conmon-rs' && github.ref == 'refs/heads/main'
    needs: build-static-s390x
    permissions:
      contents: read
      id-token: write # signs the binary, see publish-static.yml
      attestations: write # attests its provenance, SBOM and VEX document
    uses: ./.github/workflows/publish-static.yml
    with:
      arch: s390x
      digest: ${{ needs.build-static-s390x.outputs.digest }}
      sbom-digest: ${{ needs.build-static-s390x.outputs.sbom-digest }}
      vex-digest: ${{ needs.build-static-s390x.outputs.vex-digest }}
      artifact-id: ${{ needs.build-static-s390x.outputs.artifact-id }}
    secrets:
      GCS_CRIO_SA: ${{ secrets.GCS_CRIO_SA }}

  # Pushes the toolchains of main to the cache: the inputs of the static builds,
  # not the builds which get attested and published. No job needs it, a
  # failure or a cold cache holds up neither the tests nor the publishing, only
  # a release of the commit, which waits for the whole run. The jobs keep the
  # default names of a matrix: pull requests skip them, and a skipped job shows
  # a name with an expression unexpanded.
  publish-cache:
    if: github.repository == 'containers/conmon-rs' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64, ppc64le, s390x]
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: conmon-rs
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pushFilter: "(conmon-rs)"
      - run: nix build ".#$ARCH.inputDerivation"

  test-unit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: llvm-tools-preview
          save-if: ${{ env.SAVE_CACHE }}
      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-llvm-cov,cargo-nextest
      # The default features are what gets shipped, the tracing feature covers
      # the optional tracing code. The coverage of both runs gets merged. The
      # fuzzing feature is not needed, the tests build the fuzz entry points.
      # The ci profile of .config/nextest.toml retries failed tests and writes
      # a JUnit report, which lists the ones which passed on a retry.
      - name: Generate code coverage
        env:
          NEXTEST_PROFILE: ci
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov nextest --locked --no-report
          mv target/nextest/ci/junit.xml junit-default.xml
          cargo llvm-cov nextest --locked --no-report --features tracing
          mv target/nextest/ci/junit.xml junit-tracing.xml
          cargo llvm-cov report --lcov --output-path lcov.info
      # A run which failed stops the step before its report got moved. It
      # is then still in target/nextest/ci.
      - name: Report flaky tests
        if: ${{ !cancelled() }}
        run: |
          for REPORT in junit-default.xml junit-tracing.xml target/nextest/ci/junit.xml; do
            .github/report-flakes "$REPORT"
          done
      - name: Upload Results
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          flags: unit
          # Required for uploads from the protected main branch, pull requests
          # from forks fall back to tokenless uploads.
          token: ${{ secrets.CODECOV_TOKEN }}

  # The unit tests on the other architectures of the static binaries, whose
  # build-static jobs only run the binary once. arm64 runs natively, where the
  # weaker memory ordering shows races which x86 hides. ppc64le and s390x run
  # under qemu-user, which no runner has: s390x is big-endian, and the
  # protocols of the server encode their integers by hand. Tests which depend
  # on timing show up under qemu as well, it is many times slower. nextest
  # runs the tests through qemu, the binfmt registration of qemu-user-binfmt
  # the test binary which a test starts itself. Their caches are not worth a
  # place in the 10 GB of the repository, which would push out the ones of
  # the other jobs, they build in less than a minute without them.
  test-unit-arch:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: test-unit-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: ppc64le
            runner: ubuntu-latest
            target: powerpc64le-unknown-linux-gnu
            gnu: powerpc64le-linux-gnu
            packages: gcc-powerpc64le-linux-gnu libc6-dev-ppc64el-cross
          - arch: s390x
            runner: ubuntu-latest
            target: s390x-unknown-linux-gnu
            gnu: s390x-linux-gnu
            packages: gcc-s390x-linux-gnu libc6-dev-s390x-cross
    env:
      CARGO_TARGET_POWERPC64LE_UNKNOWN_LINUX_GNU_LINKER: powerpc64le-linux-gnu-gcc
      CARGO_TARGET_POWERPC64LE_UNKNOWN_LINUX_GNU_RUNNER: qemu-ppc64le -L /usr/powerpc64le-linux-gnu
      CARGO_TARGET_S390X_UNKNOWN_LINUX_GNU_LINKER: s390x-linux-gnu-gcc
      CARGO_TARGET_S390X_UNKNOWN_LINUX_GNU_RUNNER: qemu-s390x -L /usr/s390x-linux-gnu
      QEMU_LD_PREFIX: ${{ matrix.gnu && format('/usr/{0}', matrix.gnu) || '' }}
      TARGET: ${{ matrix.target }}
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}
          cache: false
      - name: Install the cross toolchain and qemu
        if: matrix.target
        env:
          PACKAGES: ${{ matrix.packages }}
        run: |
          read -ra PACKAGES <<<"$PACKAGES"
          sudo apt-get update
          sudo apt-get install -y "${PACKAGES[@]}" qemu-user-binfmt
      - name: Install cargo-nextest
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest
      # Under qemu-user, the first skipped test fails to find the reaped leader
      # of a process group through the children of the test process. qemu-user
      # keeps some real-time signals for itself and reports the exits by the
      # others with other numbers.
      - name: Run the unit tests
        run: |
          if [[ -n $TARGET ]]; then
            cargo nextest run --locked --target "$TARGET" \
              -E 'not (test(=process::tests::signal_group_reaches_members_of_reaped_leader) | test(/real_time_signal_exits$/))'
          else
            cargo nextest run --locked
          fi
      - name: Report flaky tests
        if: ${{ !cancelled() }}
        run: .github/report-flakes target/nextest/ci/junit.xml

  # The tests of the Go client which need no server and no root. The
  # integration suite, the module in pkg/client/integration, runs in the
  # test-integration jobs.
  test-unit-go:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Shares the caches with lint-go, which runs on the same image. The
      # cache entry of the key is the one of the job which saves it first,
      # which has to hold the modules of both go.mod files.
      - uses: ./.github/actions/setup-go
        id: go
      - name: Download Go modules
        run: |
          go mod download
          go -C pkg/client/integration mod download
      - run: make unit-go
      - uses: ./.github/actions/save-go
        if: env.SAVE_CACHE == 'true' && steps.go.outputs.cache-hit != 'true'
        with:
          key: ${{ steps.go.outputs.key }}
          paths: ${{ steps.go.outputs.paths }}

  # Builds all fuzz targets once, so that they keep compiling, for test-fuzz
  # to run one per job, and on main for the advisories workflow, which fuzzes
  # the targets of the latest passed run of main. A new target gets fuzzed
  # without a change here. Pull requests only build them if they change what
  # the targets build from, see changes, main always does.
  # cargo-fuzz needs a nightly toolchain. The shipped release profile would
  # strip the symbols and take long to build, the fuzz build overrides it.
  build-fuzz:
    needs: changes
    if: needs.changes.outputs.fuzz == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    env:
      CARGO_PROFILE_RELEASE_STRIP: "false"
      CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.FUZZ_TOOLCHAIN }}
          key: fuzz
          save-if: ${{ env.SAVE_CACHE }}
      # cargo-fuzz resolves the dependencies itself, a lock file which does
      # not fit fails here instead.
      - name: Check the lock file
        run: cargo fetch --locked
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-fuzz
      # The prebuilt cargo-fuzz defaults to the musl target it got built for,
      # which the sanitizers do not support.
      - name: Build fuzz targets
        run: |
          cargo fuzz build --target x86_64-unknown-linux-gnu --target-dir target/fuzz
          mkdir fuzz-targets
          for target in $(cargo fuzz list); do
            cp "target/fuzz/x86_64-unknown-linux-gnu/release/$target" fuzz-targets/
          done
      - name: List fuzz targets
        id: list
        run: echo "targets=$(cargo fuzz list | jq -Rnc '[inputs]')" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-targets
          path: fuzz-targets

  # Runs a fuzz target of a pull request for two minutes. A crash, hang or
  # allocation above the limit leaves its input in the artifacts,
  # `cargo fuzz run <target> <input> -- -timeout=10 -malloc_limit_mb=256`
  # reproduces it, see .github/run-fuzz. The run starts from the seeds in
  # fuzz/seeds and the corpus collected so far, which the daily runs of the
  # advisories workflow save. They fuzz main for half an hour, a run of main
  # here would only repeat the one of its pull request. Skipped jobs count as
  # passed for a release, see .github/release-files. The jobs keep the default
  # names of a matrix, like publish-cache and the test-fuzz jobs of the
  # advisories workflow, which forks skip.
  test-fuzz:
    if: github.event_name == 'pull_request'
    needs: build-fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.build-fuzz.outputs.targets) }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fuzz-targets
          path: fuzz-targets
      # Every run of the advisories workflow saves a new entry, the restore
      # picks the latest one.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      # See .github/run-fuzz, which the advisories workflow uses as well.
      - name: Fuzz
        run: .github/run-fuzz run "$TARGET" 120
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}-artifacts
          path: artifacts

  # The jobs which run the server pin the same Ubuntu release for every
  # architecture, the kernel and the memory budget depend on it, see
  # dependencies.yaml. amd64 runs the suite with runc as well, the release
  # which .github/install-runc pins, not the one of the containerd.io package
  # of the runner image. The runc job gates publish-marker and releases like
  # the crun job, only the crun job saves the caches.
  test-integration-amd64:
    needs: build-static-amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runtime: [crun, runc]
    name: test-integration-amd64-${{ matrix.runtime }}
    env:
      ARCH: amd64
      RUNTIME: ${{ matrix.runtime }}
      # The resident set size every spec checks the server against, its
      # private anonymous part, and how much it may grow in the memory leak
      # specs, see the Makefile. The RssAnon budget gets tightened once the
      # values the suite prints for every spec are known per architecture.
      MAX_RSS_KB: 5500
      MAX_RSS_ANON_KB: 4096
      MAX_RSS_GROWTH_KB: 2000
    steps: &test-integration-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The busybox of the tests only runs on x86, the other architectures
      # use the static one of the nixpkgs of flake.lock, which behaves the same.
      - uses: ./.github/actions/setup-nix
        if: env.ARCH != 'amd64'
      - name: Install busybox
        if: env.ARCH != 'amd64'
        run: |
          nix build --inputs-from . nixpkgs#pkgsStatic.busybox --out-link .build/busybox
          echo "BUSYBOX_BINARY=$PWD/.build/busybox/bin/busybox" >>"$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-static-${{ env.ARCH }}
          path: .build/static
      - run: chmod +x .build/static/conmonrs
      - name: Install runc
        if: env.RUNTIME == 'runc'
        run: .github/install-runc
      # What the memory budget of the server depends on.
      - name: System info
        run: |
          uname -a
          echo "Page size: $(getconf PAGESIZE)"
          grep -H . /sys/kernel/mm/transparent_hugepage/enabled /sys/kernel/mm/transparent_hugepage/hugepages-*/enabled || true
          file .build/static/conmonrs
          .build/static/conmonrs --version
      # The tests only download their files on x86, the job of amd64 saves
      # them for test-integration-coverage as well.
      - name: Integration tests
        uses: ./.github/actions/run-integration
        with:
          conmon-binary: .build/static/conmonrs
          runtime-path: ${{ env.RUNTIME == 'runc' && '/usr/local/bin/runc' || '/usr/bin/crun' }}
          max-rss-kb: ${{ env.MAX_RSS_KB }}
          max-rss-anon-kb: ${{ env.MAX_RSS_ANON_KB }}
          max-rss-growth-kb: ${{ env.MAX_RSS_GROWTH_KB }}
          report-name: test-integration-${{ env.ARCH }}-${{ env.RUNTIME }}-report
          restore-test-files: ${{ env.ARCH == 'amd64' }}
          save-test-files: ${{ env.ARCH == 'amd64' && env.RUNTIME == 'crun' && env.SAVE_CACHE == 'true' }}
          save-cache: ${{ env.RUNTIME == 'crun' && env.SAVE_CACHE || 'false' }}

  # The same suite on a native arm64 runner, the build-static jobs only run the
  # other architectures once under emulation.
  test-integration-arm64:
    needs: build-static-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      ARCH: arm64
      RUNTIME: crun
      MAX_RSS_KB: 5500
      MAX_RSS_ANON_KB: 4096
      MAX_RSS_GROWTH_KB: 2000
    steps: *test-integration-steps

  # Runs the integration tests once more against a coverage instrumented debug
  # build of the server, and with coverage of the Go client. The
  # test-integration jobs keep testing the shipped binary and its memory budget.
  # The debug build is slower, so a timing sensitive failure here only costs
  # the coverage.
  test-integration-coverage:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: llvm-tools-preview
          save-if: ${{ env.SAVE_CACHE }}
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-llvm-cov
      # The environment makes the build instrumented and every server process
      # write its profile on exit, into the target directory. The servers of
      # the tests run as root, which the report gives the profiles back from.
      - name: Build instrumented server
        id: build
        run: |
          cargo llvm-cov show-env --sh > "$RUNNER_TEMP/llvm-cov.env"
          source "$RUNNER_TEMP/llvm-cov.env"
          cargo llvm-cov clean --workspace
          cargo build --locked
          echo "profile-file=$LLVM_PROFILE_FILE" >>"$GITHUB_OUTPUT"
      # The memory budget does not apply to an instrumented debug build. A
      # failure only costs the coverage, the job stays green and uploads what
      # got covered, which shows as a drop of the coverage. A failing job would
      # fail the check, even if allowed to. The test files are the ones the
      # crun job of test-integration-amd64 saved.
      - name: Integration tests
        id: integration
        uses: ./.github/actions/run-integration
        with:
          conmon-binary: target/debug/conmonrs
          max-rss-kb: 1048576
          max-rss-anon-kb: 1048576
          test-flags: --cover --coverpkg github.com/containers/conmon-rs/pkg/client --coverprofile go-coverage.out
          test-env: LLVM_PROFILE_FILE=${{ steps.build.outputs.profile-file }}
          report-name: test-integration-coverage-report
          allow-failure: true
          restore-test-files: true
          save-cache: ${{ env.SAVE_CACHE }}
      # Keep a failure visible, the job stays green.
      - name: Report failed integration tests
        if: steps.integration.outputs.outcome == 'failure'
        run: |
          echo "::warning::The integration tests of the coverage build failed, the coverage is partial"
          echo ":warning: The integration tests of the coverage build failed, the coverage is partial." >>"$GITHUB_STEP_SUMMARY"
      - name: Generate code coverage
        run: |
          source "$RUNNER_TEMP/llvm-cov.env"
          sudo chown -R "$(id -u):$(id -g)" target .build
          cargo llvm-cov report --lcov --output-path lcov.info
      - name: Upload Results
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info,.build/report/go-coverage.out
          flags: integration
          token: ${{ secrets.CODECOV_TOKEN }}

  # Runs critest against CRI-O with the static binary. With stream_websockets,
  # CRI-O hands exec and attach to the streaming server of conmon-rs, which
  # critest reaches directly over WebSocket. CRI-O main hands port forwarding
  # to it as well, which critest speaks over SPDY, v1.37.2 keeps it.
  # The jobs with a crio tag run that release of CRI-O instead of main, whose
  # vendored client is older than the server under test. Like the others,
  # they hold back the marker and the releases: their CRI-O is pinned, so a
  # failure comes from conmon-rs, which would break the older client.
  test-critest:
    needs: build-static-amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: test-critest
            websockets: false
          - name: test-critest-websockets
            websockets: true
          # CRI-O v1.37.2 vendors a v1.0 client, which serves exec and attach
          # with stream_websockets as well, with requests that lack the fields
          # of newer clients. The later 1.37 releases vendor v1.2.1, see
          # dependencies.yaml. The releases up to 1.36 vendor a v0.7 client,
          # which passes the --cgroup-manager that v1 rejects, so they cannot
          # run a v1 server at all.
          # CRI-O starts the servers with the log driver none by default,
          # which one job keeps, the others log to the journal.
          - name: test-critest-crio-1.37
            crio: v1.37.2
            websockets: false
            server-logs: false
          - name: test-critest-crio-1.37-websockets
            crio: v1.37.2
            websockets: true
    name: ${{ matrix.name }}
    env:
      CRIO_VERSION: ${{ matrix.crio }}
      STREAM_WEBSOCKETS: ${{ matrix.websockets }}
      SERVER_LOGS: ${{ matrix.server-logs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ginkgo has a cache of its own, a Go cache saved here would lack the
      # modules of the integration jobs which share its key.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-static-amd64
          path: .build/static
      # Verifies the signatures of the CRI-O bundle, see .github/setup.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - run: .github/setup
        env:
          CONMONRS_BINARY: .build/static/conmonrs
      # critest runs the parallel specs with ginkgo, which has no binaries.
      - uses: ./.github/actions/setup-ginkgo
        with:
          save: ${{ env.SAVE_CACHE }}
      - name: Install ginkgo
        run: |
          sudo cp .build/gotools/bin/ginkgo /usr/local/bin
          ginkgo version
      - name: Run critest
        shell: bash
        run: |
          set -euox pipefail

          FLAGS=()
          if [[ $STREAM_WEBSOCKETS == true ]]; then
            FLAGS+=(--websocket-exec --websocket-attach)
          fi

          set +o errexit
          sudo -E env PATH="$PATH" critest \
            --runtime-endpoint=unix:///var/run/crio/crio.sock \
            --parallel="$(nproc)" \
            --ginkgo.flake-attempts=3 \
            --ginkgo.json-report="$PWD/critest-report.json" \
            --ginkgo.randomize-all \
            --ginkgo.timeout=2m \
            --ginkgo.trace \
            --ginkgo.v \
            "${FLAGS[@]}"
          TEST_RC=$?
          set -o errexit

          # The log belongs to the runner user, which uploads it.
          # shellcheck disable=SC2024
          sudo journalctl --no-pager >journal.log
          # Without the logs of the conmon-rs servers, which have the debug
          # level of CRI-O and would about double it. The uploaded journal
          # keeps them, their warnings and errors follow.
          if [[ $TEST_RC -ne 0 ]]; then
            grep -vF ' conmonrs[' journal.log || true
          fi

          # critest does not show the failures of the conmon-rs servers.
          # With the log driver none, they must not log at all.
          if [[ ${SERVER_LOGS:-true} == true ]]; then
            echo "::group::conmon-rs warnings and errors"
            sudo journalctl -t conmonrs -p warning --no-pager || true
            echo "::endgroup::"
          elif [[ -n $(sudo journalctl -t conmonrs --no-pager -q) ]]; then
            echo "::error::The conmon-rs servers logged to the journal with the log driver none"
            sudo journalctl -t conmonrs --no-pager -q
            TEST_RC=1
          fi

          # CRI-O logs these only if conmon-rs served the sessions. CRI-O
          # main hands port forwarding over as well, and serves it itself if
          # the server does not support it, which critest does not notice.
          # Without stream_websockets, CRI-O serves all of them itself.
          if [[ $STREAM_WEBSOCKETS == true ]]; then
            KINDS=(exec attach)
            if [[ -z $CRIO_VERSION ]]; then
              KINDS+=("port forward")
            fi
            for KIND in "${KINDS[@]}"; do
              if ! grep -q "Using $KIND URL from container monitor" journal.log; then
                echo "::error::CRI-O did not hand any $KIND session to conmon-rs"
                TEST_RC=1
              fi
            done
          elif grep -qE "Using .+ URL from container monitor" journal.log; then
            echo "::error::CRI-O handed sessions to conmon-rs without stream_websockets"
            TEST_RC=1
          fi
          exit $TEST_RC
      - name: Report flaky specs
        if: ${{ !cancelled() }}
        run: .github/report-flakes critest-report.json
      - name: Upload logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: ${{ matrix.name }}-logs
          path: |
            journal.log
            critest-report.json

  test-get-script:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        cosign: [true, false]
    name: test-get-script-${{ matrix.cosign && 'cosign' || 'checksum' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: matrix.cosign
        with:
          cosign-release: v3.1.4
      # The token keeps the marker check clear of the rate limit.
      - run: scripts/get
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # A tag resolves to its commit through the GitHub API.
      - name: Get the latest release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view -R containers/conmon-rs --json tagName -q .tagName)
          scripts/get -l "$TAG" -o .build/release/conmonrs
      # The binaries of v1.1.1 are from before the publish-static workflow,
      # the ci workflow signed them.
      - name: Get a release from before the attestations
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/get -l v1.1.1 -o .build/old/conmonrs
      # v1.0.1 has no sha256sums.txt and the bucket no checksum for it: without
      # cosign the script fails, with -k it installs the binary with warnings.
      - name: Get a release without checksums
        if: ${{ !matrix.cosign }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if scripts/get -l v1.0.1 -o .build/unverified/conmonrs 2>&1 | tee .build/get.log; then
            echo "Installed a release without checksums without -k"
            exit 1
          fi
          grep -q "Unable to fetch the checksums of release v1.0.1" .build/get.log
          scripts/get -k -l v1.0.1 -o .build/unverified/conmonrs 2>&1 | tee .build/get.log
          grep -q "WARNING: unable to fetch the checksums of release v1.0.1" .build/get.log
          test -x .build/unverified/conmonrs

  # The release workflow publishes the marker of a tag. The marker of main
  # only moves to a commit whose binaries got published and whose tests
  # passed, all of these jobs run for every main commit. Like the publish
  # jobs, it does not wait for the scans: CRI-O CI installs the binaries of
  # the marker, which a new advisory against older code must not hold back.
  # Neither for the coverage, whose integration tests may fail, nor for the
  # unit tests of the other architectures, the test-unit-arch jobs of arm64,
  # ppc64le and s390x, which a timing sensitive test fails more often, under
  # qemu above all. A release waits for them, see release.md.
  publish-marker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == 'containers/conmon-rs' && github.ref == 'refs/heads/main'
    needs:
      - publish-static-amd64
      - publish-static-arm64
      - publish-static-ppc64le
      - publish-static-s390x
      - test-unit
      - test-unit-go
      - test-integration-amd64
      - test-integration-arm64
      - test-critest
    # Runs of main commits overlap and finish in any order. The marker only
    # moves forward, see .github/create-marker, so an older run finishing
    # last cannot move it back and a failing newer run does not hold it up
    # for the ones after it. The jobs run one at a time, two could both read
    # the old marker and the older one upload last otherwise. A third job
    # replaces a waiting one, which leaves the marker behind until the next
    # commit, but never moves it back.
    concurrency:
      group: ${{ github.workflow }}-publish-marker
      cancel-in-progress: false
    steps:
      # The full history, to compare the commit with the one of the marker.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/publish-marker
        with:
          credentials: ${{ secrets.GCS_CRIO_SA }}
