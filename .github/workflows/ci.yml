name: ci
on:
  pull_request: {}
  push:
    branches:
      - main
# Pull requests cancel their outdated runs. Every main commit gets a run of its
# own: the release workflow needs the binaries of the tagged commit, and a run
# waiting in a shared group would be replaced by the one of a newer commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  NIX_VERSION: "2.35.3"
  # The toolchain of the Rust jobs. A new stable release brings new lints,
  # which a bump of this version picks up instead of unrelated pull requests.
  RUST_VERSION: "1.99.1"
  # The checksum belongs to the x86_64 Linux release of this version.
  SHELLCHECK_VERSION: "0.11.0"
  SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
  # cargo-fuzz needs a nightly toolchain, a pinned one keeps new lints and
  # compiler changes out of unrelated pull requests.
  FUZZ_TOOLCHAIN: "nightly-2026-10-15"
# The jobs are named by what they do: lint-* checks the sources,
# verify-* checks that generated or pinned things are up to date, build-* and
# test-* build and test the server, publish-* changes the bucket.
jobs:
  verify-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # zeitgeist gets built from source, see the Makefile.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make verify-dependencies
      - run: make verify-spec

  verify-proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          install_url: https://releases.nixos.org/nix/nix-${{ env.NIX_VERSION }}/install
      - run: make verify-proto

  lint-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The module is what CRI-O vendors, its go.sum has to be complete and
      # match the module proxy.
      - name: Verify the Go module
        run: |
          go mod tidy -diff
          go mod verify
      # CRI-O builds the client for FreeBSD as well.
      - name: Build the Go client for other platforms
        run: |
          for GOOS in freebsd darwin; do
            CGO_ENABLED=0 GOOS=$GOOS go build ./pkg/client/
          done
      # The sources are lint clean, so all issues fail, not only new ones.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  # One build environment for all checks of the Rust sources. Every check runs
  # even if an earlier one fails, so that a run reports all of them.
  lint-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: .github/install-deps
      - name: Select Toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt && rustup default "$RUST_VERSION"
      # The oldest toolchain the locked dependencies support.
      - name: Install the rust-version toolchain
        id: msrv
        run: |
          MSRV=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          rustup toolchain install "$MSRV" --profile minimal
          echo "version=$MSRV" >>"$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        id: setup
      # The checks only run on a complete setup, which they would report as
      # their own failures otherwise.
      - name: Rustfmt
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cargo fmt && git diff --exit-code
      # The default features are what gets shipped, all features cover the
      # optional tracing code.
      - name: Clippy Lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo clippy --locked -p conmonrs-fuzz --all-targets -- -D warnings
      # The gh-pages workflow publishes the documentation with the tracing
      # feature.
      - name: Cargo doc
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cargo doc --locked --no-deps --features tracing
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Cargo check with rust-version
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: cargo "+$MSRV" check --locked --all-targets --all-features

  lint-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck
        run: |
          curl -sSfL -o shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          sudo tar -xJf shellcheck.tar.xz --strip-components=1 -C /usr/local/bin "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          rm shellcheck.tar.xz
          shellcheck --version
      - run: make lint-shell

  # actionlint and zizmor, see the Makefile. The online audits of zizmor read
  # the GitHub API.
  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make lint-workflows
        env:
          CONTAINER_RUNTIME: docker
          GH_TOKEN: ${{ github.token }}
          ZIZMOR_FLAGS: --format=github

  lint-typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
        with:
          config: .github/typos.toml

  lint-prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      # prettier has no dependencies, npm checks it against the integrity of
      # the registry.
      - run: npx --yes "prettier@$PRETTIER_VERSION" --check .
        env:
          PRETTIER_VERSION: 3.9.10

  verify-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  # The architectures are the packages of flake.nix, .github/release-files and
  # scripts/get list them as well. Every architecture gets its own build and
  # publish job: the tests only wait for their build, and each publish only
  # for its own build. The builds have no access to the signing credentials,
  # see publish-static.yml.
  build-static-amd64:
    uses: ./.github/workflows/build-static.yml
    with:
      arch: amd64
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  build-static-arm64:
    uses: ./.github/workflows/build-static.yml
    with:
      arch: arm64
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  build-static-ppc64le:
    uses: ./.github/workflows/build-static.yml
    with:
      arch: ppc64le
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  build-static-s390x:
    uses: ./.github/workflows/build-static.yml
    with:
      arch: s390x
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  # Attests, signs and uploads the binaries of main. The tests do not wait for
  # it, an outage of the signing services only holds up the marker.
  publish-static-amd64:
    if: github.repository == 'containers/conmon-rs' && github.ref == 'refs/heads/main'
    needs: build-static-amd64
    permissions:
      contents: read
      id-token: write # signs the binary, see publish-static.yml
      attestations: write # attests its provenance and SBOM
    uses: ./.github/workflows/publish-static.yml
    with:
      arch: amd64
      digest: ${{ needs.build-static-amd64.outputs.digest }}
      artifact-id: ${{ needs.build-static-amd64.outputs.artifact-id }}
    secrets:
      GCS_CRIO_SA: ${{ secrets.GCS_CRIO_SA }}

  publish-static-arm64:
    if: github.repository == 'containers/conmon-rs' && github.ref == 'refs/heads/main'
    needs: build-static-arm64
    permissions:
      contents: read
      id-token: write # signs the binary, see publish-static.yml
      attestations: write # attests its provenance and SBOM
    uses: ./.github/workflows/publish-static.yml
    with:
      arch: arm64
      digest: ${{ needs.build-static-arm64.outputs.digest }}
      artifact-id: ${{ needs.build-static-arm64.outputs.artifact-id }}
    secrets:
      GCS_CRIO_SA: ${{ secrets.GCS_CRIO_SA }}

  publish-static-ppc64le:
    if: github.repository == 'containers/conmon-rs' && github.ref == 'refs/heads/main'
    needs: build-static-ppc64le
    permissions:
      contents: read
      id-token: write # signs the binary, see publish-static.yml
      attestations: write # attests its provenance and SBOM
    uses: ./.github/workflows/publish-static.yml
    with:
      arch: ppc64le
      digest: ${{ needs.build-static-ppc64le.outputs.digest }}
      artifact-id: ${{ needs.build-static-ppc64le.outputs.artifact-id }}
    secrets:
      GCS_CRIO_SA: ${{ secrets.GCS_CRIO_SA }}

  publish-static-s390x:
    if: github.repository == 'containers/conmon-rs' && github.ref == 'refs/heads/main'
    needs: build-static-s390x
    permissions:
      contents: read
      id-token: write # signs the binary, see publish-static.yml
      attestations: write # attests its provenance and SBOM
    uses: ./.github/workflows/publish-static.yml
    with:
      arch: s390x
      digest: ${{ needs.build-static-s390x.outputs.digest }}
      artifact-id: ${{ needs.build-static-s390x.outputs.artifact-id }}
    secrets:
      GCS_CRIO_SA: ${{ secrets.GCS_CRIO_SA }}

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: .github/install-deps
      - name: Select Toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component llvm-tools-preview && rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-llvm-cov,cargo-nextest
      # The default features are what gets shipped, the tracing feature covers
      # the optional tracing code. The coverage of both runs gets merged. The
      # fuzzing feature only exists for the fuzz targets, which no test runs.
      # The ci profile of .config/nextest.toml retries failed tests and writes
      # a JUnit report, which lists the ones which passed on a retry.
      - name: Generate code coverage
        env:
          NEXTEST_PROFILE: ci
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov nextest --locked --no-report
          mv target/nextest/ci/junit.xml junit-default.xml
          cargo llvm-cov nextest --locked --no-report --features tracing
          mv target/nextest/ci/junit.xml junit-tracing.xml
          cargo llvm-cov report --lcov --output-path lcov.info
      - name: Report flaky tests
        if: ${{ !cancelled() }}
        run: |
          for REPORT in junit-default.xml junit-tracing.xml target/nextest/ci/junit.xml; do
            .github/report-flakes "$REPORT"
          done
      - name: Upload Results
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          flags: unit
          # Required for uploads from the protected main branch, pull requests
          # from forks fall back to tokenless uploads.
          token: ${{ secrets.CODECOV_TOKEN }}

  # The tests of the Go client which need no server and no root. The
  # integration suite, TestConmonClient, runs in the test-integration jobs.
  test-unit-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make unit-go

  # Builds all fuzz targets once, so that they keep compiling, for test-fuzz
  # to run one per job. A new target gets fuzzed without a change here.
  # cargo-fuzz needs a nightly toolchain. The shipped release profile would
  # strip the symbols and take long to build, the fuzz build overrides it.
  build-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    env:
      CARGO_PROFILE_RELEASE_STRIP: "false"
      CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: .github/install-deps
      - name: Select Toolchain
        run: rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal && rustup default "$FUZZ_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: fuzz
      # cargo-fuzz resolves the dependencies itself, a lock file which does
      # not fit fails here instead.
      - name: Check the lock file
        run: cargo fetch --locked
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-fuzz
      # The prebuilt cargo-fuzz defaults to the musl target it got built for,
      # which the sanitizers do not support.
      - name: Build fuzz targets
        run: |
          cargo fuzz build --target x86_64-unknown-linux-gnu --target-dir target/fuzz
          mkdir fuzz-targets
          for target in $(cargo fuzz list); do
            cp "target/fuzz/x86_64-unknown-linux-gnu/release/$target" fuzz-targets/
          done
      - name: List fuzz targets
        id: list
        run: echo "targets=$(cargo fuzz list | jq -Rnc '[inputs]')" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-targets
          path: fuzz-targets

  # Runs a fuzz target for two minutes. A crash leaves its input in the
  # artifacts, `cargo fuzz run <target> <input>` reproduces it. The run starts
  # from the seeds in fuzz/seeds and the corpus collected so far, which only
  # the runs on main save.
  test-fuzz:
    needs: build-fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.build-fuzz.outputs.targets) }}
    name: test-fuzz-${{ matrix.target }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fuzz-targets
          path: fuzz-targets
      # Every run saves a new entry, the restore picks the latest one.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      # New inputs go to the first directory, the seeds stay as they are. A
      # target may have no seeds yet.
      - name: Fuzz
        env:
          # Like cargo-fuzz runs the targets.
          ASAN_OPTIONS: detect_odr_violation=0
        run: |
          chmod +x "fuzz-targets/$TARGET"
          mkdir -p corpus artifacts "fuzz/seeds/$TARGET"
          "fuzz-targets/$TARGET" -max_total_time=120 -artifact_prefix=artifacts/ corpus "fuzz/seeds/$TARGET"
      # Keeps only the inputs which add coverage beyond the seeds, so the
      # corpus stays small. The merge adds the inputs which cover more than
      # the first directory, which starts with the seeds for that. They come
      # from the checkout and get removed again.
      - name: Minimize the corpus
        if: github.ref == 'refs/heads/main'
        env:
          ASAN_OPTIONS: detect_odr_violation=0
        run: |
          mkdir minimized
          cp -r "fuzz/seeds/$TARGET/." minimized
          "fuzz-targets/$TARGET" -merge=1 minimized corpus
          find "fuzz/seeds/$TARGET" -type f -printf '%f\0' | (cd minimized && xargs -0r rm --)
          rm -rf corpus
          mv minimized corpus
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main'
        with:
          path: corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}-artifacts
          path: artifacts

  test-integration-amd64:
    needs: build-static-amd64
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARCH: amd64
      # The resident set size every spec checks the server against, and how
      # much it may grow in the memory leak specs, see the Makefile.
      MAX_RSS_KB: 5500
      MAX_RSS_GROWTH_KB: 2000
    steps: &test-integration-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The tests run as root and keep their files per user ID.
      - name: Setup Testfiles Cache
        if: env.ARCH == 'amd64'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/conmon-test-images-0
          key: ${{ runner.os }}-cargo-test-files-${{ hashFiles('pkg/client/files_test.go') }}
      # The busybox of the tests only runs on x86, the other architectures
      # use the static one of the nixpkgs of flake.lock, which behaves the same.
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        if: env.ARCH != 'amd64'
        with:
          install_url: https://releases.nixos.org/nix/nix-${{ env.NIX_VERSION }}/install
      - name: Install busybox
        if: env.ARCH != 'amd64'
        run: |
          nix build --inputs-from . nixpkgs#pkgsStatic.busybox --out-link .build/busybox
          echo "BUSYBOX_BINARY=$PWD/.build/busybox/bin/busybox" >>"$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-static-${{ env.ARCH }}
          path: .build/static
      - run: chmod +x .build/static/conmonrs
      # What the memory budget of the server depends on.
      - name: System info
        run: |
          uname -a
          echo "Page size: $(getconf PAGESIZE)"
          grep -H . /sys/kernel/mm/transparent_hugepage/enabled /sys/kernel/mm/transparent_hugepage/hugepages-*/enabled || true
          file .build/static/conmonrs
          .build/static/conmonrs --version
      - run: .github/install-crun
      - name: create symlink
        run: sudo ln -f -s "$(go env GOROOT)"/bin/* /usr/bin/
      # make integration installs ginkgo, which has no binaries.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/gotools/bin/ginkgo
          key: ginkgo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod') }}
      - name: Integration tests
        run: |
          sudo -E make integration \
            RUNTIME_PATH=/usr/bin/crun \
            CONMON_BINARY=.build/static/conmonrs \
            MAX_RSS_KB="$MAX_RSS_KB" \
            MAX_RSS_GROWTH_KB="$MAX_RSS_GROWTH_KB" \
            TEST_FLAGS="--flake-attempts 3 --output-dir .build/report --json-report report.json"
      - name: Report flaky specs
        if: ${{ !cancelled() }}
        run: .github/report-flakes .build/report/report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: test-integration-${{ env.ARCH }}-report
          path: .build/report/report.json
      # The tests run as root, setup-go saves its cache as the runner user.
      - name: Chown cache
        run: |
          sudo chown -R "$(id -u):$(id -g)" ~/go/pkg/mod
          sudo chown -R "$(id -u):$(id -g)" ~/.cache/go-build

  # The same suite on a native arm64 runner, the build-static jobs only run the
  # other architectures once under emulation.
  test-integration-arm64:
    needs: build-static-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      ARCH: arm64
      MAX_RSS_KB: 5500
      MAX_RSS_GROWTH_KB: 2000
    steps: *test-integration-steps

  # Runs the integration tests once more against a coverage instrumented debug
  # build of the server, and with coverage of the Go client. The
  # test-integration jobs keep testing the shipped binary and its memory budget.
  # The debug build is slower, so a timing sensitive failure here only costs
  # the coverage.
  test-integration-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Saved by the test-integration-amd64 job.
      - name: Restore Testfiles Cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/conmon-test-images-0
          key: ${{ runner.os }}-cargo-test-files-${{ hashFiles('pkg/client/files_test.go') }}
      - run: .github/install-deps
      - name: Select Toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component llvm-tools-preview && rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-llvm-cov
      - run: .github/install-crun
      - name: create symlink
        run: sudo ln -f -s "$(go env GOROOT)"/bin/* /usr/bin/
      # The environment makes the build instrumented and every server process
      # write its profile into the target directory on exit.
      - name: Build instrumented server
        run: |
          cargo llvm-cov show-env --sh > "$RUNNER_TEMP/llvm-cov.env"
          source "$RUNNER_TEMP/llvm-cov.env"
          cargo llvm-cov clean --workspace
          cargo build --locked
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/gotools/bin/ginkgo
          key: ginkgo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod') }}
      # The memory budget does not apply to an instrumented debug build. A
      # failure only costs the coverage, the job stays green and uploads what
      # got covered, which shows as a drop of the coverage. A failing job would
      # fail the check, even if allowed to.
      - name: Integration tests
        id: integration
        continue-on-error: true
        run: |
          source "$RUNNER_TEMP/llvm-cov.env"
          sudo -E make integration \
            RUNTIME_PATH=/usr/bin/crun \
            CONMON_BINARY=target/debug/conmonrs \
            MAX_RSS_KB=1048576 \
            TEST_FLAGS="--flake-attempts 3 --output-dir .build/report --json-report report.json --cover --coverprofile go-coverage.out"
      # Keep a failure visible, the job stays green.
      - name: Report failed integration tests
        if: steps.integration.outcome == 'failure'
        run: |
          echo "::warning::The integration tests of the coverage build failed, the coverage is partial"
          echo ":warning: The integration tests of the coverage build failed, the coverage is partial." >>"$GITHUB_STEP_SUMMARY"
      - name: Generate code coverage
        run: |
          sudo chown -R "$(id -u):$(id -g)" target .build
          source "$RUNNER_TEMP/llvm-cov.env"
          cargo llvm-cov report --lcov --output-path lcov.info
      - name: Upload Results
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info,.build/report/go-coverage.out
          flags: integration
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Report flaky specs
        if: ${{ !cancelled() }}
        run: .github/report-flakes .build/report/report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: test-integration-coverage-report
          path: .build/report/report.json
      - name: Chown cache
        run: |
          sudo chown -R "$(id -u):$(id -g)" ~/go/pkg/mod
          sudo chown -R "$(id -u):$(id -g)" ~/.cache/go-build

  # Runs critest against CRI-O with the static binary. With stream_websockets,
  # CRI-O hands exec and attach to the streaming server of conmon-rs, which
  # critest reaches directly over WebSocket. Port forwarding stays with CRI-O.
  test-critest:
    needs: build-static-amd64
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        websockets: [false, true]
    name: test-critest${{ matrix.websockets && '-websockets' || '' }}
    env:
      STREAM_WEBSOCKETS: ${{ matrix.websockets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-static-amd64
          path: .build/static
      - run: .github/setup
      # critest runs the parallel specs with ginkgo, which has no binaries.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/gotools/bin/ginkgo
          key: ginkgo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod') }}
      - name: Install ginkgo
        run: |
          make .install.ginkgo
          sudo cp .build/gotools/bin/ginkgo /usr/local/bin
          ginkgo version
      - name: Run critest
        shell: bash
        run: |
          set -euox pipefail

          sudo cp .build/static/conmonrs /usr/libexec/crio/conmonrs
          sudo chmod +x /usr/libexec/crio/conmonrs

          FLAGS=()
          if [[ $STREAM_WEBSOCKETS == true ]]; then
            FLAGS+=(--websocket-exec --websocket-attach)
          fi

          set +o errexit
          sudo -E PATH="$PATH" critest \
            --runtime-endpoint=unix:///var/run/crio/crio.sock \
            --parallel="$(nproc)" \
            --ginkgo.flake-attempts=3 \
            --ginkgo.json-report="$PWD/critest-report.json" \
            --ginkgo.randomize-all \
            --ginkgo.timeout=2m \
            --ginkgo.trace \
            --ginkgo.v \
            "${FLAGS[@]}"
          TEST_RC=$?
          set -o errexit

          # The log belongs to the runner user, which uploads it.
          # shellcheck disable=SC2024
          sudo journalctl --no-pager >journal.log
          test $TEST_RC -ne 0 && cat journal.log

          # CRI-O logs these only if conmon-rs served the sessions.
          if [[ $STREAM_WEBSOCKETS == true ]]; then
            for KIND in exec attach; do
              if ! grep -q "Using $KIND URL from container monitor" journal.log; then
                echo "::error::CRI-O did not hand any $KIND session to conmon-rs"
                TEST_RC=1
              fi
            done
          fi
          exit $TEST_RC
      - name: Report flaky specs
        if: ${{ !cancelled() }}
        run: .github/report-flakes critest-report.json
      - name: Upload logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: test-critest${{ matrix.websockets && '-websockets' || '' }}-logs
          path: |
            journal.log
            critest-report.json

  test-get-script:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cosign: [true, false]
    name: test-get-script-${{ matrix.cosign && 'cosign' || 'checksum' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: matrix.cosign
        with:
          cosign-release: v3.1.4
      - run: scripts/get
      # A tag resolves to its commit through the GitHub API.
      - name: Get the latest release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view -R containers/conmon-rs --json tagName -q .tagName)
          scripts/get -l "$TAG" -o .build/release/conmonrs

  # The release workflow publishes the marker of a tag.
  publish-marker:
    runs-on: ubuntu-latest
    if: github.repository == 'containers/conmon-rs' && github.ref == 'refs/heads/main'
    needs:
      - publish-static-amd64
      - publish-static-arm64
      - publish-static-ppc64le
      - publish-static-s390x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Runs of main commits overlap and finish in any order. The marker only
      # moves forward, so an older run finishing last cannot move it back and
      # a failing newer run does not hold it up for the ones after it.
      - name: Check the current marker
        id: main
        run: |
          CURRENT=$(curl -sSfL "https://storage.googleapis.com/cri-o/conmon-rs/latest-main.txt?ts=$(date +%s)" || true)
          if [[ ! $CURRENT =~ ^[0-9a-f]{40}$ ]] ||
            ! git cat-file -e "$CURRENT^{commit}" 2>/dev/null ||
            git merge-base --is-ancestor "$CURRENT" "$GITHUB_SHA"; then
            echo "forward=true" >>"$GITHUB_OUTPUT"
          else
            echo "The marker already points to the newer commit $CURRENT"
            echo "forward=false" >>"$GITHUB_OUTPUT"
          fi
      - run: .github/create-marker
        if: steps.main.outputs.forward == 'true'
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: steps.main.outputs.forward == 'true'
        with:
          credentials_json: ${{ secrets.GCS_CRIO_SA }}
      # The marker changes in place, caches must not serve an old one.
      - uses: google-github-actions/upload-cloud-storage@6397bd7208e18d13ba2619ee21b9873edc94427a # v3.0.0
        if: steps.main.outputs.forward == 'true'
        with:
          path: .
          glob: latest-*.txt
          destination: cri-o/conmon-rs
          headers: |-
            cache-control: no-cache
