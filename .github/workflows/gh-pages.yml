name: gh-pages
on:
  push:
    branches:
      - main
permissions: {}
# Only the documentation of the latest commit matters. A deployment which
# already started finishes, a newer run waits for it.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.99.1"
jobs:
  # Runs the build scripts of all dependencies, so it gets no write access.
  # The deploy job only publishes the artifact. Forks have no Pages of the
  # repository to deploy to.
  build:
    if: github.repository == 'containers/conmon-rs'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Nothing waits for the docs, a cache would only take space from the
      # ones of the ci workflow.
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_VERSION }}
          cache: false
      # The crate has no public API besides the entry point, the private items
      # are the documentation of the server internals. The fuzzing feature only
      # adds the entry points of the fuzz targets.
      - name: Build Documentation
        run: |
          cargo doc --locked --features tracing --no-deps --document-private-items
          echo '<meta http-equiv="refresh" content="0; url=conmonrs/index.html">' >target/doc/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/doc

  deploy:
    if: github.repository == 'containers/conmon-rs'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # deploys the artifact
      id-token: write # proves the origin of the deployment to Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
