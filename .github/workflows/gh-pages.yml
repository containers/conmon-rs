name: gh-pages
on:
  push:
    branches:
      - main
permissions: {}
# Only the documentation of the latest commit matters. A deployment which
# already started finishes, a newer run waits for it.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.99.1"
jobs:
  # Runs the build scripts of all dependencies, so it gets no write access.
  # The deploy job only publishes the artifact.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: .github/install-deps
      - name: Select Toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
      # Only the docs get published, a cache entry cannot change the binaries.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The crate has no public API besides the entry point, the private items
      # are the documentation of the server internals. The fuzzing feature only
      # adds the entry points of the fuzz targets.
      - name: Build Documentation
        run: |
          cargo doc --locked --features tracing --no-deps --document-private-items
          echo '<meta http-equiv="refresh" content="0; url=conmonrs/index.html">' >target/doc/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # deploys the artifact
      id-token: write # proves the origin of the deployment to Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
