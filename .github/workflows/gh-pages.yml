name: gh-pages
on:
  push:
    branches:
      - main
# Deploys with an SSH key, the token only needs to read.
permissions:
  contents: read
# Only the documentation of the latest commit matters.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  publish-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: .github/install-deps
      - name: Select Toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      # Only the docs get published, a cache entry cannot change the binaries.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build Documentation
        run: cargo doc --locked --all-features --no-deps
      - name: Deploy Documentation
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          publish_branch: gh-pages
          publish_dir: ./target/doc
          force_orphan: true
