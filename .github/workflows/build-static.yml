name: build-static
# Builds the static binary of an architecture and its SBOM, and adds the VEX
# document of the repository, without access to any signing or cache
# credentials. On main, the publish-static workflow attests, signs and uploads
# the artifact, see there.
on:
  workflow_call:
    inputs:
      arch:
        description: The architecture to build, a package of the flake.
        required: true
        type: string
    # Tie the publishing to exactly this build.
    outputs:
      digest:
        description: The sha256 of the binary.
        value: ${{ jobs.build.outputs.digest }}
      sbom-digest:
        description: The sha256 of the SPDX SBOM of the binary.
        value: ${{ jobs.build.outputs.sbom-digest }}
      vex-digest:
        description: The sha256 of the OpenVEX document of the binary.
        value: ${{ jobs.build.outputs.vex-digest }}
      artifact-id:
        description: The artifact which holds the binary, its SBOM and its VEX document.
        value: ${{ jobs.build.outputs.artifact-id }}
permissions: {}
env:
  NIX_VERSION: "2.35.3"
jobs:
  # A cold cache builds the cross toolchains, which takes about an hour.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
      sbom-digest: ${{ steps.digest.outputs.sbom-digest }}
      vex-digest: ${{ steps.digest.outputs.vex-digest }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    env:
      ARCH: ${{ inputs.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          install_url: https://releases.nixos.org/nix/nix-${{ env.NIX_VERSION }}/install
      # The cache holds the cross toolchains, which take an hour to build. The
      # build only reads it, the publish-cache job of the ci workflow pushes.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: conmon-rs
      - run: nix build ".#$ARCH"
      - run: file result/bin/conmonrs | grep static | grep stripped
      # Every binary runs once until it serves its socket, see
      # .github/smoke-test, a build which links but does not run would
      # otherwise only show up on the target machines. The integration tests
      # only cover amd64 and arm64. flake.lock decides the Rust toolchain of
      # the build, not RUST_VERSION of the ci workflow, the summary shows
      # which one it was.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: inputs.arch != 'amd64'
      - name: Smoke test
        timeout-minutes: 5
        env:
          IMAGE: docker.io/library/alpine:3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
        run: |
          RUN=(docker run --rm --platform "linux/$ARCH" -v "$PWD/result/bin:/smoke:ro")
          VERSION=$("${RUN[@]}" "$IMAGE" /smoke/conmonrs --version)
          echo "$VERSION"
          printf '### conmonrs.%s\n\n~~~\n%s\n~~~\n' "$ARCH" "$VERSION" >>"$GITHUB_STEP_SUMMARY"
          "${RUN[@]}" -v "$PWD/.github/smoke-test:/smoke-test:ro" "$IMAGE" /smoke-test /smoke/conmonrs
      # The build embeds its dependencies with cargo-auditable, which syft
      # reads. syft writes SPDX 2.3, SPDX 3 needs a generator which reads them
      # and attest-sbom support. The SBOM names the file it scanned, which is
      # the published name of the binary.
      - name: SBOM
        run: |
          mkdir static "$RUNNER_TEMP/sbom"
          cp result/bin/conmonrs static/conmonrs
          cp result/bin/conmonrs "$RUNNER_TEMP/sbom/conmonrs.$ARCH"
          nix shell --inputs-from . nixpkgs#syft --command \
            syft scan "file:$RUNNER_TEMP/sbom/conmonrs.$ARCH" -q -o spdx-json=static/conmonrs.spdx.json
          jq -e '.packages | length > 10' static/conmonrs.spdx.json >/dev/null
      # The same document for every binary, which states how known
      # vulnerabilities of its crates affect conmon-rs, see release.md.
      - name: VEX
        run: |
          .github/verify-vex
          cp vex/conmonrs.openvex.json static/conmonrs.vex.json
      - name: Digest
        id: digest
        run: |
          {
            echo "digest=$(sha256sum static/conmonrs | cut -d' ' -f1)"
            echo "sbom-digest=$(sha256sum static/conmonrs.spdx.json | cut -d' ' -f1)"
            echo "vex-digest=$(sha256sum static/conmonrs.vex.json | cut -d' ' -f1)"
          } >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: build-static-${{ inputs.arch }}
          path: static
