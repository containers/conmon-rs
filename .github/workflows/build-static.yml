name: build-static
# Builds the static binary of an architecture, without access to any signing
# credentials. On main, the publish-static workflow attests, signs and uploads
# the artifact, see there.
on:
  workflow_call:
    inputs:
      arch:
        description: The architecture to build, a package of the flake.
        required: true
        type: string
    secrets:
      CACHIX_AUTH_TOKEN:
        description: Pushes the build to the cachix cache.
        required: false
    # Tie the publishing to exactly this build.
    outputs:
      digest:
        description: The sha256 of the binary.
        value: ${{ jobs.build.outputs.digest }}
      artifact-id:
        description: The artifact which holds the binary.
        value: ${{ jobs.build.outputs.artifact-id }}
permissions: {}
env:
  NIX_VERSION: "2.35.3"
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    env:
      ARCH: ${{ inputs.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          install_url: https://releases.nixos.org/nix/nix-${{ env.NIX_VERSION }}/install
      # The cache holds the cross toolchains, which take an hour to build. Only
      # main pushes, the attested builds of main substitute what earlier main
      # builds built, other runs only read. The pushes leave out conmon-rs.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: conmon-rs
          authToken: ${{ github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}
          pushFilter: "(conmon-rs)"
      - run: nix build ".#$ARCH"
      - run: file result/bin/conmonrs | grep static | grep stripped
      # Every binary gets executed once, a build which links but does not
      # run would otherwise only show up on the target machines.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: inputs.arch != 'amd64'
      - name: Smoke test
        run: |
          docker run --rm --platform "linux/$ARCH" \
            -v "$PWD/result/bin:/smoke:ro" alpine:3.24 /smoke/conmonrs --version
      - name: Digest
        id: digest
        run: echo "digest=$(sha256sum result/bin/conmonrs | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: build-static-${{ inputs.arch }}
          path: result/bin/conmonrs
