name: advisories
# The verify-deny and verify-vulnerabilities jobs of the ci workflow only run
# on changes. New advisories against the locked dependencies of an unchanged
# main and its binaries show up here, like newer versions of the tools of
# dependencies.yaml.
on:
  # GitHub starts scheduled runs late, often by hours, so the run is set early
  # to finish before the merges of the day. Off the full hour helps a little.
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify-advisories:
    if: github.repository == 'containers/conmon-rs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command-arguments: advisories

  # The Go dependencies follow CRI-O, which vendors the client, so a finding
  # only fails this run to notify, without a PR to update them. The standard
  # library is the one of the Go toolchain which builds CRI-O, so the latest
  # Go release checks it instead of the minimum version of go.mod.
  verify-go-advisories:
    if: github.repository == 'containers/conmon-rs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: govulncheck
        run: |
          set -o pipefail
          if ! go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./... | tee govulncheck.txt; then
            printf '### govulncheck\n\n~~~\n%s\n~~~\n' "$(cat govulncheck.txt)" >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  # New vulnerabilities of the crates of the latest binaries of main, which the
  # verify-vulnerabilities job of the ci workflow only scans on changes. The
  # scan uses the attested SBOMs of the binaries, and the VEX document of main,
  # which may have statements the published one of the binaries does not have
  # yet.
  verify-vulnerabilities:
    if: github.repository == 'containers/conmon-rs'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      attestations: read # verifies the SBOMs
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch and verify the SBOMs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMIT=$(curl -sSfL --retry 5 "https://storage.googleapis.com/cri-o/conmon-rs/latest-main.txt?ts=$(date +%s)")
          if [[ ! $COMMIT =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::latest-main.txt does not name a commit: $COMMIT"
            exit 1
          fi
          printf 'The binaries of %s on main.\n\n' "$COMMIT" | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir -p .build/sboms
          cd .build/sboms
          ../../.github/release-files sboms "$COMMIT"
      # The vulnerability database, one of about 500 MB which grype builds
      # about once a day. Its key names the build, see .github/scan-sboms.
      # This job and the verify-vulnerabilities job of the ci workflow on main
      # save it once grype updated it, the prune-caches job deletes the older
      # ones, so that they do not push the build caches out.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: grype-db
        with:
          path: .build/grype-db
          key: grype-db-
          restore-keys: grype-db-
      - name: Scan
        id: scan
        env:
          CONTAINER_RUNTIME: docker
        run: |
          SBOMS=(.build/sboms/*.spdx.json)
          make scan SBOMS="${SBOMS[*]}"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() && steps.scan.outputs.db-key && steps.scan.outputs.db-key != steps.grype-db.outputs.cache-matched-key }}
        with:
          path: .build/grype-db
          key: ${{ steps.scan.outputs.db-key }}

  # Deletes the caches of main which a newer one of the same kind replaced,
  # once the jobs here which save caches are done, also if they failed. Every
  # run of this workflow saves a corpus per fuzz target, a newer
  # vulnerability database gets saved as well, and a change of a lock file, a
  # toolchain or the Go version starts new Rust, Go and ginkgo caches, which
  # would push the current ones out of the 10 GB of the repository. It keeps
  # the newest entry by creation time of the vulnerability database, of the
  # corpus of each fuzz target and of each Rust, Go and ginkgo cache key
  # without its hashes and Go version: the jobs only restore the entries of
  # their current toolchain and Go version, which the newest one has. An
  # entry saved while it runs is newer than the listed ones and stays. Every
  # other entry stays: the caches of pull requests cannot replace the ones of
  # main, and like the ones of an image which no job uses any more, or of the
  # keys which rarely change, they expire after a week without access. The
  # only job which deletes caches, so the only one with write access to them,
  # it runs no code of the checkout.
  prune-caches:
    needs:
      - verify-vulnerabilities
      - test-fuzz
    if: ${{ !cancelled() && github.repository == 'containers/conmon-rs' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write # deletes the caches
    steps:
      # The newest entries come first, so that a list which the limit cuts
      # short still has the newest one of each kind. An entry which the quota
      # of the repository evicted in between is gone already.
      - name: Delete the replaced caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DELETE=$(gh cache list --repo "$GITHUB_REPOSITORY" --ref refs/heads/main \
            --sort created_at --order desc --limit 1000 --json id,key,createdAt --jq '
              map(.kind = (.key |
                if test("^fuzz-corpus-.+-[0-9]+-[0-9]+$") then sub("-[0-9]+-[0-9]+$"; "")
                elif test("^grype-db-") then "grype-db"
                elif test("^v0-rust-.+-[0-9a-f]{8}-[0-9a-f]{8}$") then sub("-[0-9a-f]{8}-[0-9a-f]{8}$"; "")
                elif test("^setup-go-.+-go-[^-]+-[0-9a-f]{64}$") then sub("-go-[^-]+-[0-9a-f]{64}$"; "")
                elif test("^ginkgo-.+-[0-9a-f]{64}$") then sub("(-go[^-]+)?-[0-9a-f]{64}$"; "")
                else null end)) |
              map(select(.kind)) | group_by(.kind)[] |
              sort_by(.createdAt[:19], .id)[:-1][] |
              "\(.id) \(.key)"')
          if [[ -z $DELETE ]]; then
            echo "No replaced caches"
            exit 0
          fi
          while read -r ID KEY; do
            echo "Deleting $KEY"
            if ! OUTPUT=$(gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$ID" 2>&1); then
              if [[ $OUTPUT != *"(HTTP 404)"* ]]; then
                echo "::error::Unable to delete $KEY: $OUTPUT"
                exit 1
              fi
              echo "$KEY is gone already"
            fi
          done <<<"$DELETE"

  # Warns about newer upstream releases of the tools of dependencies.yaml, and
  # fails for an image whose tag has another digest than the pinned one: a
  # bump of the tag without the digest, or a tag which moved, like alpine:3.24
  # to a new patch release or a rebuild of node. The pull requests do not
  # check it, a moved tag would fail them all.
  verify-dependencies-upstream:
    if: github.repository == 'containers/conmon-rs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check for updates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          make verify-dependencies-upstream | tee upstream.txt
          sed -n 's/^Update available/::warning::Update available/p' upstream.txt
      - name: Check the digests of the images
        if: ${{ !cancelled() }}
        run: make verify-digests

  # Fuzzes every target for half an hour, the test-fuzz jobs of the ci
  # workflow only the ones of pull requests for two minutes, with the same
  # .github/run-fuzz. The targets are the ones of the latest passed ci run of
  # main, the corpus the one of the run before, which the run extends and
  # saves. The jobs keep the default names of a matrix, see test-fuzz of the
  # ci workflow.
  list-fuzz-targets:
    if: github.repository == 'containers/conmon-rs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # downloads the fuzz targets of the ci run
      contents: read
    outputs:
      run-id: ${{ steps.run.outputs.run-id }}
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - name: Find the latest ci run of main
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
            --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [[ ! $RUN_ID =~ ^[0-9]+$ ]]; then
            echo "::error::No passed ci run of main found, which the fuzz targets come from: ${RUN_ID:-none}"
            exit 1
          fi
          echo "run-id=$RUN_ID" >>"$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fuzz-targets
          path: fuzz-targets
          run-id: ${{ steps.run.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: List the fuzz targets
        id: list
        env:
          RUN_ID: ${{ steps.run.outputs.run-id }}
        run: |
          TARGETS=$(find fuzz-targets -type f -printf '%f\n' | sort | jq -Rnc '[inputs]')
          if [[ $TARGETS == "[]" ]]; then
            echo "::error::The fuzz-targets artifact of ci run $RUN_ID holds no fuzz targets"
            exit 1
          fi
          echo "targets=$TARGETS" >>"$GITHUB_OUTPUT"

  test-fuzz:
    needs: list-fuzz-targets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read # downloads the fuzz targets of the ci run
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.list-fuzz-targets.outputs.targets) }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fuzz-targets
          path: fuzz-targets
          run-id: ${{ needs.list-fuzz-targets.outputs.run-id }}
          github-token: ${{ github.token }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz
        run: .github/run-fuzz run "$TARGET" 1800
      - name: Minimize the corpus
        run: .github/run-fuzz minimize "$TARGET"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}-artifacts
          path: artifacts
