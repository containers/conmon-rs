name: advisories
# The verify-deny job of the ci workflow only runs on changes. New advisories
# against the locked dependencies of an unchanged main show up here, like
# newer versions of the tools of dependencies.yaml.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify-advisories:
    if: github.repository == 'containers/conmon-rs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command-arguments: advisories

  # The Go dependencies follow CRI-O, which vendors the client, so a finding
  # only fails this run to notify, without a PR to update them. The standard
  # library is the one of the Go toolchain which builds CRI-O, so the latest
  # Go release checks it instead of the minimum version of go.mod.
  verify-go-advisories:
    if: github.repository == 'containers/conmon-rs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: govulncheck
        run: |
          set -o pipefail
          if ! go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./... | tee govulncheck.txt; then
            printf '### govulncheck\n\n~~~\n%s\n~~~\n' "$(cat govulncheck.txt)" >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  # Warns about newer upstream releases of the tools of dependencies.yaml.
  verify-dependencies-upstream:
    if: github.repository == 'containers/conmon-rs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check for updates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          make verify-dependencies-upstream | tee upstream.txt
          sed -n 's/^Update available/::warning::Update available/p' upstream.txt
