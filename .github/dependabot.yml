version: 2
# New releases wait a week before they get proposed, so that a compromised or
# broken one has time to get yanked. Patch releases of crates wait less, the
# nixpkgs of flake.lock moves to the newest revision older than a week.
# Security updates do not wait.
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: daily
      time: "11:00"
    cooldown:
      default-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 10
    labels:
      - "release-note-none"
    allow:
      - dependency-type: direct
      - dependency-type: indirect
    groups:
      capnp:
        patterns:
          - "capnp*"
      opentelemetry:
        patterns:
          - "opentelemetry*"
          - "tracing-opentelemetry"
      rust-dependencies:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "capnp*"
          - "opentelemetry*"
          - "tracing-opentelemetry"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - "release-note-none"
  # The Go dependencies follow CRI-O, which vendors the client, so only
  # security updates get opened.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels:
      - "release-note-none"
  # nixpkgs decides the toolchain and the C library of the static binaries,
  # see the build-static jobs, which print the rustc version.
  - package-ecosystem: nix
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - "release-note-none"
